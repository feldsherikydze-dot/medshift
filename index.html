<style>
:root{--ac:#0b5394;--bg:#f4f6f8;--card:#fff;--tx:#111;--mut:#666;--bd:#e0e0e0}
body.dark{--bg:#12161c;--card:#1c232c;--tx:#e8e8e8;--mut:#9aa5b1;--bd:#2a3340}
body{font-family:system-ui;margin:0;background:var(--bg);color:var(--tx)}
header{background:var(--ac);color:#fff;padding:10px 14px;font-size:18px;display:flex;justify-content:space-between;align-items:center}
header #alarm{cursor:pointer}
nav{display:flex;background:var(--card);border-bottom:1px solid var(--bd);position:sticky;top:0;z-index:10}
nav button{flex:1;padding:11px 2px;border:0;background:none;font-size:13px;color:var(--tx)}
nav button.on{box-shadow:inset 0 -3px 0 var(--ac);font-weight:600}
main{padding:12px;max-width:960px;margin:0 auto}
.card{background:var(--card);border:1px solid var(--bd);border-radius:10px;padding:12px;margin-bottom:10px}
table{width:100%;border-collapse:collapse;font-size:14px}
td,th{padding:6px 4px;border-bottom:1px solid var(--bd);text-align:left;vertical-align:top}
.badge{border-radius:8px;padding:2px 8px;font-size:12px;white-space:nowrap}
.bExp{background:#ffd2d2;color:#7a1010}.bSoon{background:#ffe0c2;color:#8a4b00}.bWarn{background:#fff3c2;color:#7a6000}.bOk{background:#d9f2d9;color:#1b5e20}
.bG{background:#2e7d32;color:#fff}.bY{background:#f9a825;color:#332}.bR{background:#c62828;color:#fff}
body.dark .bExp{background:#5c2020;color:#ffd2d2}body.dark .bSoon{background:#5c3a1a;color:#ffe0c2}
body.dark .bWarn{background:#54470f;color:#fff3c2}body.dark .bOk{background:#1e4620;color:#d9f2d9}
tr.exp{background:#ffe3e3}tr.soon{background:#ffedd9}tr.warn{background:#fff8d6}
body.dark tr.exp{background:#4d1d1d}body.dark tr.soon{background:#4d301d}body.dark tr.warn{background:#443a10}
.btn{background:var(--ac);color:#fff;border:0;border-radius:8px;padding:9px 14px;font-size:15px;margin:4px 4px 4px 0;cursor:pointer}
.btn.sec{background:transparent;color:var(--ac);border:1px solid var(--ac)}
.btn.del{background:transparent;color:#c62828;border:1px solid #c62828;padding:4px 8px;margin:0}
.btn.mini{padding:4px 8px;margin:0}
.btn.wide{width:100%;padding:12px;font-size:16px;margin:4px 0}
input,select,textarea{padding:8px;border:1px solid var(--bd);border-radius:8px;font-size:15px;width:100%;box-sizing:border-box;background:var(--card);color:var(--tx)}
textarea{min-height:80px;font-size:13px}
label{font-size:13px;color:var(--mut)}
.sugg{position:relative}
.sugg ul{position:absolute;left:0;right:0;background:var(--card);border:1px solid var(--bd);border-radius:8px;margin:0;padding:0;list-style:none;max-height:220px;overflow:auto;z-index:50}
.sugg li{padding:8px;cursor:pointer}
.sugg li:hover{background:var(--ac);color:#fff}
.row{display:flex;gap:8px}.row>*{flex:1}
.alert{background:#ffe3e3;border:1px solid #e57373;border-radius:10px;padding:10px;margin-bottom:10px;color:#7a1010}
body.dark .alert{background:#4d1d1d;color:#ffd2d2}
.miss{background:#fff8d6;border:1px solid #e0c060;border-radius:10px;padding:10px;margin:8px 0;font-size:14px;color:#7a6000}
body.dark .miss{background:#443a10;color:#fff3c2}
.prev{max-height:260px;overflow:auto;border:1px solid var(--bd);border-radius:8px;margin:8px 0}
.prev input{padding:4px;font-size:13px}
.wgrid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
@media(max-width:640px){.wgrid{grid-template-columns:1fr}}
.wgt{background:var(--card);border:1px solid var(--bd);border-radius:10px;padding:10px;text-align:center}
.wgt .big{font-size:24px;font-weight:700;white-space:pre-line}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:2px;font-size:11px}
.cal div{padding:3px 0;text-align:center;border-radius:6px}
.cal .td{background:var(--ac);color:#fff;font-weight:700}.cal .hd{color:var(--mut);font-weight:600}
.chatbox{height:280px;overflow:auto;background:var(--card);border:1px solid var(--bd);border-radius:10px;padding:8px}
.msg{margin:4px 0;padding:6px 8px;border-radius:8px;background:var(--bg);font-size:14px}
.msg b{color:var(--ac)}.msg small{color:var(--mut)}
.chk{display:flex;gap:6px;align-items:center;font-size:14px;margin:3px 0}
.chk input{width:auto}
#dlg::backdrop{background:rgba(0,0,0,.45)}
.loginwrap{max-width:420px;margin:40px auto}
.bigbtn{display:block;width:100%;margin:6px 0;padding:14px;border-radius:12px;border:1px solid var(--bd);background:var(--card);color:var(--tx);font-size:16px;text-align:left;cursor:pointer}
.bigbtn b{color:var(--ac)}

const LS='medshift_v3',VER=3;
let DB=JSON.parse(localStorage.getItem(LS)||'null');
const S=()=>DB.settings;
function save(){localStorage.setItem(LS,JSON.stringify(DB))}
function uid(){return DB.seq++}
function esc(s){return(s==null?'':String(s)).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]))}

DB={seq:1,ver:VER,settings:{warnDays:10,city:'',accent:'#0b5394',dark:false},users:[],session:null,

bags:[],cars:[],ecg:[],uchet:[],reports:[],tasks:[],monthly:[],chat:[]};save()}
let tab='home',loginFor=null,room='общая';
function me(){return DB.users.find(u=>u.id===DB.session)||null}
function isBoss(){const u=me();return!!u&&(u.role==='admin'||u.role==='lead')}
function applyTheme(){const s=S();document.documentElement.style.setProperty('--ac',s.accent);document.body.classList.toggle('dark',!!s.dark)}
function openDlg(html){dlgBody.innerHTML=html;dlg.showModal()}
function closeDlg(){dlg.close()}
function todayStr(){return new Date().toISOString().slice(0,10)}
function daysLeft(iso){const d=new Date(iso+'T00:00:00'),t=new Date();t.setHours(0,0,0,0);return Math.round((d-t)/864e5)}
function badgeExp(iso){if(!iso)return'<span class="badge bWarn">нет срока</span>';const d=daysLeft(iso);
if(d<0)return`<span class="badge bExp">просрочен ${-d} дн</span>`;if(d<=S().warnDays)return`<span class="badge bSoon">осталось ${d} дн</span>`;
if(d<=30)return`<span class="badge bWarn">${d} дн</span>`;return`<span class="badge bOk">${d} дн</span>`}
function rowCls(iso){if(!iso)return'';const d=daysLeft(iso);if(d<0)return'exp';if(d<=S().warnDays)return'soon';if(d<=30)return'warn';return''}
function myObjects(){const u=me();if(!u)return{bags:[],cars:[]};
return{bags:DB.bags.filter(b=>isBoss()||(u.bags||[]).includes(b.id)),cars:DB.cars.filter(c=>isBoss()||(u.cars||[]).includes(c.id))}}
function soonItems(){const r=[];const mo=myObjects();
mo.bags.forEach(b=>b.items.forEach(it=>{if(it.expiry&&daysLeft(it.expiry)<=S().warnDays)r.push({obj:b.name,it})}));
mo.cars.forEach(c=>c.kits.forEach(k=>k.items.forEach(it=>{if(it.expiry&&daysLeft(it.expiry)<=S().warnDays)r.push({obj:c.name+' / '+k.name,it})})));
return r}
function monthlyDue(){const u=me();if(!u)return[];const mk=todayStr().slice(0,7),d=new Date().getDate();if(d>5)return[];
const r=[];const mo=myObjects();
mo.bags.forEach(b=>{if(!DB.monthly.some(m=>m.kind==='bag'&&m.objId===b.id&&m.month===mk))r.push('сумка '+b.name)});
mo.cars.forEach(c=>{if(!DB.monthly.some(m=>m.kind==='car'&&m.objId===c.id&&m.month===mk))r.push('машина '+c.name)});
return r}
function alerts(){const a=[];const so=soonItems();
if(so.length)a.push({t:`⏰ Истекает/просрочено по вашим объектам: ${so.length} поз.`,l:'bSoon'});
DB.cars.forEach(c=>c.equip.forEach(e=>{if(e.status==='def'&&(isBoss()||(me()&&(me().cars||[]).includes(c.id))))a.push({t:`🔧 ${c.name}: дефект ${e.name}${e.defect?' ('+e.defect+')':''}`,l:'bExp'})}));
DB.uchet.forEach(k=>k.items.forEach(it=>{if(it.expiry&&daysLeft(it.expiry)<=S().warnDays)a.push({t:`🔐 Учёт ${k.name}: ${it.name} — срок!`,l:'bExp'})}));
const md=monthlyDue();if(md.length)a.push({t:`📋 Месячная проверка: ${md.join(', ')} — отметьте проверку`,l:'bWarn'});
if(isBoss()){const pend=DB.reports.filter(r=>!r.viewed).length;if(pend)a.push({t:`📨 Непросмотренных отчётов: ${pend}`,l:'bWarn'});
DB.tasks.forEach(t=>{if(!t.done&&(Date.now()-t.ts)/864e5>3)a.push({t:`📌 Задача висит >3 дней: ${t.text}`,l:'bWarn'})})}
return a}
function renderNav(){const tabs=me()?[['home','Главная'],['bags','Сумки'],['cars','Машины'],['uchet','Учёт'],['chat','Чат'],['set','Ещё']]:[];
nav.innerHTML=tabs.map(t=>`<button class="${tab===t[0]?'on':''}" onclick="go('${t[0]}')">${t[1]}</button>`).join('')}
function go(t){tab=t;renderNav();render()}
function render(){if(!me()){main.innerHTML=loginView();alarm.innerHTML='';return}
main.innerHTML=tab==='home'?homeView():tab==='bags'?bagsView():tab==='cars'?carsView():tab==='uchet'?uchetView():tab==='chat'?chatView():setView();
const a=alerts();alarm.innerHTML=a.length?`<span class="badge bExp">⚠ ${a.length}</span>`:'';

function parseGS1(v){v=v.replace(/^\]..?/,'');const L={'01':14,'17':6};const out={};let i=0;
while(i<v.length-1){const ai=v.slice(i,i+2);i+=2;let val;if(L[ai]){val=v.slice(i,i+L[ai]);i+=L[ai]}else{let j=v.indexOf('\x1d',i);val=j<0?v.slice(i):v.slice(i,j);i=j<0?v.length:j+1}out[ai]=val}
if(out['17'])out.expiry=expFrom17(out['17']);if(out['10'])out.batch=out['10'];if(out['01'])out.gtin=out['01'];return out}
function expFrom17(v){if(!/^\d{6}$/.test(v))return'';let yy=+v.slice(0,2),mm=+v.slice(2,4),dd=+v.slice(4,6);
let y=yy<50?2000+yy:1900+yy;if(mm<1||mm>12)mm=12;const last=new Date(y,mm,0).getDate();if(dd<1||dd>last)dd=last;
return y+'-'+String(mm).padStart(2,'0')+'-'+String(dd).padStart(2,'0')}

const UNITS='амп|ампул|ампула|фл|шт|пар|пары|бл|блистер|уп|упак|туб|тюба|туба|компл|комплект';
function normUnit(u){u=(u||'').toLowerCase().replace('.','');if(/^(амп|ампул|ампула)$/.test(u))return'амп';if(/^(фл|флак)$/.test(u))return'фл';
if(/^(бл|блистер)$/.test(u))return'блистер';if(/^(уп|упак)$/.test(u))return'уп';if(/^(туб|тюба|туба)$/.test(u))return'туба';
if(/^(пар|пары)$/.test(u))return'пар';if(/^(компл|комплект)$/.test(u))return'компл';return u||'шт'}
function parseItems(text){const out=[];text.split(/\r?\n/).forEach(raw=>{let line=raw.trim();if(!line)return;
line=line.replace(/^\s*\d{1,3}\s*[.)]\s*/,'');if(!line)return;let qty=1,unit='';
const m=line.match(new RegExp('^(.*?)\\s*[—-]?\\s*(\\d{1,4})\\s*('+UNITS+')\\.?$','i'));
if(m){line=m[1].trim();qty=+m[2];unit=normUnit(m[3])}
let name=line,spec='';const sm=line.match(/^(.*?)(\s(?:р-р|раствор|таб|табл|капс|пор|аэр|сусп|мазь|гель|конц|конт|система|шприц|перчатки|бинт|салфетка|пластырь|игла|катетер|жгут|контейнер|маска|настойка|туба|набор|шина|зажим|стилет|фильтр|чехол|одеяло|грелка|воронка|зонд|аспиратор|ларингоскоп|повязка|покрывало|ножницы|пинцет|стетоскоп|языкодержатель|иглодержатель|роторасширитель|переходник|устройство|комплект)\b[\s\S]*)$/i);
if(sm&&sm[1].trim().length>=3){name=sm[1].trim();spec=sm[2].trim()}
if(name)out.push({on:true,name,spec,qty,unit})});return out}
function parseEquip(text){const out=[];text.split(/\r?\n/).forEach(raw=>{let line=raw.trim();if(!line)return;
line=line.replace(/^\s*\d{1,3}\s*[.)]\s*/,'');if(!line)return;
const om=line.match(/((?:ОС|ОБМ|ОВМ|ос|обм|овм)\s?-\s?\d{3,6}|\b\d{4,6}(?:\s?,\s?\d{4,6})+\b|\b0\d{3,5}\b)/);
let ovm='';if(om){ovm=om[1].trim();line=line.replace(om[0],'').trim()}
line=line.replace(/\s*[—-]\s*$/,'').trim();
if(line)out.push({on:true,ovm:ovm.replace(/\s/g,''),name:line,status:'ok',charge:''})});return out}

function calcIssues(){const c=DB.cars.find(x=>x.id===repCtx.carId);const exp=[];

return exp}

const st=(exp.length>0||(m==='rem'&&defSel>=3))?'red':(m==='rem'?'yellow':'green');

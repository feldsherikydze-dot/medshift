<style>
:root{--ac:#0b5394;--bg:#f4f6f8;--card:#fff;--tx:#111;--mut:#666;--bd:#ddd}
body.dark{--bg:#12161c;--card:#1c232c;--tx:#e8e8e8;--mut:#9aa5b1;--bd:#2a3340}
body{font-family:system-ui;margin:0;background:var(--bg);color:var(--tx)}
header{background:var(--ac);color:#fff;padding:10px 14px;font-size:18px}
nav{display:flex;background:var(--card);border-bottom:1px solid var(--bd);position:sticky;top:0}
nav button{flex:1;padding:11px 2px;border:0;background:none;font-size:12px;color:var(--tx)}
nav button.on{box-shadow:inset 0 -3px 0 var(--ac);font-weight:600}
main{padding:12px;max-width:900px;margin:0 auto}
.card{background:var(--card);border:1px solid var(--bd);border-radius:10px;padding:12px;margin-bottom:10px}
table{width:100%;border-collapse:collapse;font-size:14px}
td,th{padding:6px 4px;border-bottom:1px solid var(--bd);text-align:left;vertical-align:top}
.badge{border-radius:8px;padding:2px 8px;font-size:12px;white-space:nowrap}
.bExp{background:#ffd2d2;color:#7a1010}.bSoon{background:#ffe0c2;color:#8a4b00}
.bWarn{background:#fff3c2;color:#7a6000}.bOk{background:#d9f2d9;color:#1b5e20}
.bG{background:#2e7d32;color:#fff}.bY{background:#f9a825;color:#332}.bR{background:#c62828;color:#fff}
tr.exp{background:#ffe3e3}tr.soon{background:#ffedd9}
.btn{background:var(--ac);color:#fff;border:0;border-radius:8px;padding:9px 14px;font-size:15px;margin:4px 4px 4px 0}
.btn.sec{background:transparent;color:var(--ac);border:1px solid var(--ac)}
.btn.del{background:transparent;color:#c62828;border:1px solid #c62828;padding:4px 8px;margin:0}
.btn.mini{padding:4px 8px;margin:0}
.btn.wide{width:100%;padding:12px;margin:4px 0}
input,select,textarea{padding:8px;border:1px solid var(--bd);border-radius:8px;font-size:15px;width:100%;box-sizing:border-box;background:var(--card);color:var(--tx)}
textarea{min-height:70px}
label{font-size:13px;color:var(--mut)}
.row{display:flex;gap:8px}.row>*{flex:1}
.prev{max-height:240px;overflow:auto;border:1px solid var(--bd);border-radius:8px;margin:6px 0;padding:4px}
.loginwrap{max-width:420px;margin:40px auto}
.bigbtn{display:block;width:100%;margin:6px 0;padding:14px;border-radius:12px;border:1px solid var(--bd);background:var(--card);color:var(--tx);font-size:16px;text-align:left}
.chatbox{height:280px;overflow:auto;background:var(--card);border:1px solid var(--bd);border-radius:10px;padding:8px;margin:8px 0}
.msg{margin:4px 0;padding:6px 8px;border-radius:8px;background:var(--bg);font-size:14px}
.msg b{color:var(--ac)}.msg small{color:var(--mut)}
.wgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.wgrid .card{margin-bottom:0}
.wgrid .span2{grid-column:span 2}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:2px;font-size:11px}
.cal div{padding:3px 0;text-align:center;border-radius:6px}
.cal .td{background:var(--ac);color:#fff;font-weight:700}
.cal .hd{color:var(--mut);font-weight:600}
.thumbs{display:flex;flex-wrap:wrap;gap:8px}
.thumbs img{width:110px;height:110px;object-fit:cover;border-radius:8px;border:1px solid var(--bd);cursor:pointer}
.toast{position:fixed;left:50%;bottom:18px;transform:translateX(-50%);background:#222;color:#fff;padding:10px 18px;border-radius:10px;font-size:14px;opacity:0;pointer-events:none;transition:opacity .3s;z-index:99;max-width:90%}
.toast.show{opacity:1}
#dlg{margin:8px auto;max-height:calc(100vh - 16px);overflow:auto}
#dlg::backdrop{background:rgba(0,0,0,.45)}
</style>

function compressImage(f,cb){var r=new FileReader();
r.onload=function(){var im=new Image();
im.onload=function(){var max=1200;var w=im.width,h=im.height;
if(w>max||h>max){var k=Math.min(max/w,max/h);w=Math.round(w*k);h=Math.round(h*k)}
var cv=document.createElement('canvas');cv.width=w;cv.height=h;
cv.getContext('2d').drawImage(im,0,0,w,h);
cb(cv.toDataURL('image/jpeg',0.7))};
im.src=r.result};
r.readAsDataURL(f)}

function toggleBiometric(on){var u=me();if(!u)return;
if(!u.pin){toast('Сначала задайте PIN');render();return}
if(on)enableBiometric();else disableBiometric()}
async function enableBiometric(){try{
var u=me();if(!u||!u.pin){toast('Нет PIN');return}
var challenge=new Uint8Array(32);crypto.getRandomValues(challenge);
var cred=await navigator.credentials.create({publicKey:{
challenge:challenge,rp:{name:'МедСмена'},user:{id:new TextEncoder().encode(String(u.id)),name:u.name,displayName:u.name},
pubKeyCredParams:[{alg:-7,type:'public-key'},{alg:-257,type:'public-key'}],
authenticatorSelection:{authenticatorAttachment:'platform',userVerification:'required'},
timeout:60000,attestation:'none'}});
if(!cred){toast('Отменено');render();return}
var id=btoa(String.fromCharCode.apply(null,Array.from(new Uint8Array(cred.rawId))));
localStorage.setItem('medshift_bio',JSON.stringify({userId:u.id,credentialId:id}));
toast('🔓 Биометрия включена');render()}catch(e){toast('Не вышло: '+(e.message||'устройство не поддерживает'));render()}}
async function disableBiometric(){localStorage.removeItem('medshift_bio');toast('🔒 Биометрия выключена');render()}
async function biometricLogin(){try{
var _bio=localStorage.getItem('medshift_bio');if(!_bio){toast('Биометрия не настроена');return}
var b=JSON.parse(_bio);var u=DB.users.find(function(x){return x.id===b.userId});
if(!u){toast('Пользователь не найден');localStorage.removeItem('medshift_bio');render();return}
var challenge=new Uint8Array(32);crypto.getRandomValues(challenge);
var raw=Uint8Array.from(atob(b.credentialId),function(c){return c.charCodeAt(0)});
var cred=await navigator.credentials.get({publicKey:{
challenge:challenge,allowCredentials:[{id:raw,type:'public-key'}],
userVerification:'required',timeout:60000}});
if(!cred){toast('Отменено');return}
DB.session=u.id;save();presBeat();go('home');toast('Вход выполнен ✅')}catch(e){toast('Не удалось — войдите по PIN')}}
function logout(){DB.session=null;localStorage.setItem('medshift_rem','0');localStorage.removeItem('medshift_rem_ts');save();go('home')}

openDlg('<h3>'+(c?'Машина':'Новый автомобиль СМП')+'</h3><label>Бортовой номер</label><input id="cName" value="'+(c?esc(c.name):'')+'"><label>Госномер</label><input id="cPlates" value="'+(c?esc(c.plates||''):'')+'">'+(c?'':'<label><input type="checkbox" style="width:auto" id="cFill" checked> Заполнить базовым шаблоном оборудования (31 поз., без ОВМ)</label><label><input type="checkbox" style="width:auto" id="kRes" checked> 🚑 Реанимационная укладка</label><label><input type="checkbox" style="width:auto" id="kTra" checked> 🦴 Травматологическая укладка</label><label><input type="checkbox" style="width:auto" id="kAk" checked> 🤰 Акушерская укладка</label><label><input type="checkbox" style="width:auto" id="kThr" checked> ❄️ Термосумка</label>')+'<p><button class="btn" onclick="saveCarDlg('+(id||'null')+')">Сохранить</button></p>')}
function saveCarDlg(id){var n=document.getElementById('cName').value.trim();
if(!n)return toast('Введите номер');
var pl=document.getElementById('cPlates').value.trim();
if(id){var c=DB.cars.find(function(x){return x.id===id});c.name=n;c.plates=pl}
else{var fe=document.getElementById('cFill');
var eq=(!fe||fe.checked)?EQ.map(function(e){return {id:uid(),ovm:'',name:e[1],status:'ok',charge:'',defect:''}}):[];
var kits=[];
function kitOn(elId,arr,nm){var el=document.getElementById(elId);if(el&&el.checked)kits.push({id:uid(),name:nm,items:mkKit(arr)})}
kitOn('kRes',RE,'Реанимационная укладка');kitOn('kTra',TR,'Травматологическая укладка');kitOn('kAk',AK,'Акушерская укладка');kitOn('kThr',TM,'Термосумка (холодовой режим)');
DB.cars.push({id:uid(),name:n,plates:pl,equip:eq,kits:kits})}
save();closeDlg();render();toast('Машина сохранена')}
function openRespDlg(uid){var u=DB.users.find(function(x){return x.id===uid});
var h='<h3>Ответственность: '+esc(u.name)+'</h3>';
h+='<label>Роль</label><select id="rsRole"><option value="user"'+(u.role==='user'?' selected':'')+'>сотрудник</option><option value="lead"'+(u.role==='lead'?' selected':'')+'>руководитель</option><option value="admin"'+(u.role==='admin'?' selected':'')+'>админ</option></select>';
h+='<label>Машины</label>';
DB.cars.forEach(function(c){h+='<label><input type="checkbox" style="width:auto"'+((u.cars||[]).indexOf(c.id)>=0?' checked':'')+' data-k="cars" data-id="'+c.id+'"> '+esc(c.name)+'</label>'});
h+='<label>Сумки</label>';
DB.bags.forEach(function(b){h+='<label><input type="checkbox" style="width:auto"'+((u.bags||[]).indexOf(b.id)>=0?' checked':'')+' data-k="bags" data-id="'+b.id+'"> '+esc(b.name)+'</label>'});
h+='<p><button class="btn" onclick="saveRespDlg('+uid+')">Сохранить</button></p>';
openDlg(h)}
function saveRespDlg(uid){var u=DB.users.find(function(x){return x.id===uid});
u.role=document.getElementById('rsRole').value;u.cars=[];u.bags=[];
var boxes=dlgBody.querySelectorAll('input[type=checkbox]');
for(var i=0;i<boxes.length;i++){var b=boxes[i];if(!b.checked)continue;
var id=+b.getAttribute('data-id');
if(b.getAttribute('data-k')==='cars')u.cars.push(id);else u.bags.push(id)}
save();closeDlg();render();toast('Ответственность сохранена')}
function fbUrl(p){return FB_CONF.databaseURL.replace(/\/$/,'')+'/'+p+'.json'}
function restPut(p,o){return fetch(fbUrl(p),{method:'PUT',headers:{'Content-Type':'application/json'},body:JSON.stringify(o)}).then(function(r){if(!r.ok)throw new Error('HTTP '+r.status);return r}).catch(function(e){SYNCSTAT.lastErr=String(e.message||e);throw e})}
function restGet(p){return fetch(fbUrl(p)).then(function(r){if(!r.ok){SYNCSTAT.lastErr='HTTP '+r.status;return null}return r.json()}).catch(function(e){SYNCSTAT.lastErr=String(e.message||e);return null})}
function syncPush(){if(!FB_CONF.databaseURL)return;clearTimeout(pushT);pushT=setTimeout(function(){
var d=JSON.parse(JSON.stringify(DB));delete d.session;
restPut('state',{rev:DB.rev||0,data:d}).then(function(){return restPut('meta',{rev:DB.rev||0,ts:Date.now()})}).then(function(){SYNCSTAT.pushOk=true;SYNCSTAT.lastPush=Date.now();SYNCSTAT.lastErr='';updHead()}).catch(function(){SYNCSTAT.pushOk=false;updHead()})},800)}
function mergeArr(local,rem){var ids={};local.forEach(function(x){ids[x.id]=1});
rem.forEach(function(x){if(!ids[x.id])local.push(x)});
local.sort(function(a,b){return (a.ts||0)-(b.ts||0)});return local}
function mergeUsers(rem,loc){var ids={};rem.forEach(function(u){ids[u.id]=1});
loc.forEach(function(u){if(!ids[u.id])rem.push(u)});return rem}
function adoptState(rem,rrev){rem.chat=mergeArr(rem.chat||[],DB.chat);
rem.reports=mergeArr(rem.reports||[],DB.reports);
rem.tasks=mergeArr(rem.tasks||[],DB.tasks);
rem.users=mergeUsers(rem.users||[],DB.users);
rem.session=DB.session;
DB=rem;DB.rev=rrev;localStorage.setItem(LS,JSON.stringify(DB));applyTheme();render();toast('🔄 Синхронизировано')}
function syncPull(){if(!FB_CONF.databaseURL)return;restGet('meta').then(function(m){SYNCSTAT.lastPull=Date.now();
if(m&&m.rev&&(m.rev>(DB.rev||0))){restGet('state').then(function(v){if(v&&v.data&&(v.rev||0)>(DB.rev||0))adoptState(v.data,v.rev||0)})}})}
function presBeat(){if(!FB_CONF.databaseURL)return;
restPut('online/'+DEV,{n:(me()||{}).name||'гость',t:Date.now()}).catch(function(){});
restGet('online').then(function(o){if(!o){onlineN=null;updHead();return}var n=0,now=Date.now();
for(var k in o){if(o[k]&&o[k].t&&now-o[k].t<70000)n++}
onlineN=n;updHead()})}
function syncTest(){if(!FB_CONF.databaseURL){toast('Склад не настроен');return}
restPut('ping/'+DEV,{t:Date.now()}).then(function(){return restGet('ping/'+DEV)}).then(function(v){toast(v&&v.t?'📡 Связь со складом есть':'⚠ Склад не отвечает')}).catch(function(){toast('⚠ Ошибка: '+SYNCSTAT.lastErr)})}
function syncInit(){if(!FB_CONF.databaseURL)return;
presBeat();syncPull();
setInterval(presBeat,20000);
setInterval(syncPull,12000);
document.addEventListener('visibilitychange',function(){if(!document.hidden){presBeat();syncPull()}});
window.addEventListener('pagehide',function(){try{fetch(fbUrl('online/'+DEV),{method:'DELETE',keepalive:true})}catch(e){}})}
var _st=localStorage.getItem('medshift_tab');
if(_st&&['home','bags','cars','sched','chat','set'].indexOf(_st)>=0)tab=_st;
if(DB.session){var _rem=localStorage.getItem('medshift_rem');var _ts=+localStorage.getItem('medshift_rem_ts')||0;
if(_rem!=='1'||Date.now()-_ts>864e5){loginFor=DB.session;DB.session=null;localStorage.setItem('medshift_rem','0');localStorage.setItem(LS,JSON.stringify(DB))}}
setInterval(function(){if(DB.session&&localStorage.getItem('medshift_rem')==='1'){var ts=+localStorage.getItem('medshift_rem_ts')||0;
if(Date.now()-ts>864e5){loginFor=DB.session;DB.session=null;localStorage.setItem('medshift_rem','0');render();toast('Сессия истекла (24 ч) — введите PIN')}}},60000);
syncInit();
applyTheme();
go(tab);
</script>
</body>
</html>

<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>МедСмена</title>
<style>
:root{--ac:#0b5394;--bg:#f4f6f8;--card:#fff;--tx:#111;--mut:#666;--bd:#ddd}
body{font-family:system-ui;margin:0;background:var(--bg);color:var(--tx)}
header{background:var(--ac);color:#fff;padding:10px 14px;font-size:18px}
nav{display:flex;background:var(--card);border-bottom:1px solid var(--bd);position:sticky;top:0}
nav button{flex:1;padding:11px 2px;border:0;background:none;font-size:13px}
nav button.on{box-shadow:inset 0 -3px 0 var(--ac);font-weight:600}
main{padding:12px;max-width:900px;margin:0 auto}
.card{background:var(--card);border:1px solid var(--bd);border-radius:10px;padding:12px;margin-bottom:10px}
table{width:100%;border-collapse:collapse;font-size:14px}
td,th{padding:6px 4px;border-bottom:1px solid var(--bd);text-align:left;vertical-align:top}
.badge{border-radius:8px;padding:2px 8px;font-size:12px;white-space:nowrap}
.bExp{background:#ffd2d2;color:#7a1010}.bSoon{background:#ffe0c2;color:#8a4b00}
.bWarn{background:#fff3c2;color:#7a6000}.bOk{background:#d9f2d9;color:#1b5e20}
.bG{background:#2e7d32;color:#fff}.bY{background:#f9a825;color:#332}.bR{background:#c62828;color:#fff}
tr.exp{background:#ffe3e3}tr.soon{background:#ffedd9}
.btn{background:var(--ac);color:#fff;border:0;border-radius:8px;padding:9px 14px;font-size:15px;margin:4px 4px 4px 0}
.btn.sec{background:transparent;color:var(--ac);border:1px solid var(--ac)}
.btn.del{background:transparent;color:#c62828;border:1px solid #c62828;padding:4px 8px;margin:0}
.btn.mini{padding:4px 8px;margin:0}
.btn.wide{width:100%;padding:12px;margin:4px 0}
input,select,textarea{padding:8px;border:1px solid var(--bd);border-radius:8px;font-size:15px;width:100%;box-sizing:border-box}
textarea{min-height:70px}
label{font-size:13px;color:var(--mut)}
.row{display:flex;gap:8px}.row>*{flex:1}
.loginwrap{max-width:420px;margin:40px auto}
.bigbtn{display:block;width:100%;margin:6px 0;padding:14px;border-radius:12px;border:1px solid var(--bd);background:var(--card);font-size:16px;text-align:left}
#dlg::backdrop{background:rgba(0,0,0,.45)}
</style>
</head>
<body>
<header>МедСмена <span id="alarm"></span></header>
<nav id="nav"></nav>
<main id="main"></main>
<dialog id="dlg" style="width:min(680px,95%)"><div id="dlgBody"></div></dialog>
<script>
window.SEED=[];
var LS='medshift_v3';
var DB=JSON.parse(localStorage.getItem(LS)||'null');
function S(){return DB.settings}
function save(){localStorage.setItem(LS,JSON.stringify(DB))}
function uid(){return DB.seq++}
function esc(s){s=(s==null?'':String(s));
return s.split('&').join('&amp;').split('<').join('&lt;').split('>').join('&gt;').split('"').join('&quot;')}
if(!DB){DB={seq:1,settings:{warnDays:10},users:[],session:null,bagTypes:[],bags:[],cars:[],ecg:[],reports:[],tasks:[]};save()}
var tab='home',loginFor=null,curBag=null,curCar=null,curKit=null,repCar=null;
function me(){for(var i=0;i<DB.users.length;i++)if(DB.users[i].id===DB.session)return DB.users[i];return null}
function isBoss(){var u=me();return !!u&&(u.role==='admin'||u.role==='lead')}
function openDlg(h){dlgBody.innerHTML=h;dlg.showModal()}
function closeDlg(){dlg.close()}
function todayStr(){return new Date().toISOString().slice(0,10)}
function daysLeft(iso){var d=new Date(iso+'T00:00:00'),t=new Date();t.setHours(0,0,0,0);return Math.round((d-t)/864e5)}
function badgeExp(iso){if(!iso)return '<span class="badge bWarn">нет срока</span>';var d=daysLeft(iso);
if(d<0)return '<span class="badge bExp">просрочен '+(-d)+' дн</span>';
if(d<=S().warnDays)return '<span class="badge bSoon">осталось '+d+' дн</span>';
if(d<=30)return '<span class="badge bWarn">'+d+' дн</span>';
return '<span class="badge bOk">'+d+' дн</span>'}
function rowCls(iso){if(!iso)return '';var d=daysLeft(iso);if(d<0)return 'exp';if(d<=S().warnDays)return 'soon';return ''}
function myBags(){var u=me();if(!u)return [];if(isBoss())return DB.bags;
return DB.bags.filter(function(b){return (u.bags||[]).indexOf(b.id)>=0})}
function myCars(){var u=me();if(!u)return [];if(isBoss())return DB.cars;
return DB.cars.filter(function(c){return (u.cars||[]).indexOf(c.id)>=0})}
function soonList(){var r=[];
myBags().forEach(function(b){b.items.forEach(function(it){if(it.expiry&&daysLeft(it.expiry)<=S().warnDays)r.push(b.name+': '+it.name)})});
myCars().forEach(function(c){c.kits.forEach(function(k){k.items.forEach(function(it){if(it.expiry&&daysLeft(it.expiry)<=S().warnDays)r.push(c.name+' / '+k.name+': '+it.name)})})});
return r}
function alerts(){var a=[];var so=soonList();
if(so.length)a.push({t:'Истекает/просрочено: '+so.length+' поз.',l:'bSoon'});
DB.cars.forEach(function(c){c.equip.forEach(function(e){if(e.status==='def')a.push({t:c.name+': дефект '+e.name,l:'bExp'})})});
if(isBoss()){var p=0;DB.reports.forEach(function(r){if(!r.viewed)p++});if(p)a.push({t:'Непросмотренных отчётов: '+p,l:'bWarn'})}
return a}
function renderNav(){var u=me();nav.innerHTML='';if(!u)return;
var tabs=[['home','Главная'],['bags','Сумки'],['cars','Машины'],['set','Ещё']];
tabs.forEach(function(t){var b=document.createElement('button');
if(tab===t[0])b.className='on';b.textContent=t[1];b.onclick=function(){go(t[0])};nav.appendChild(b)})}
function go(t){tab=t;renderNav();render()}
function render(){var u=me();
if(!u){main.innerHTML=loginView();document.getElementById('alarm').innerHTML='';return}
if(tab==='home')main.innerHTML=homeView();
else if(tab==='bags')main.innerHTML=bagsView();
else if(tab==='cars')main.innerHTML=carsView();
else main.innerHTML=setView();
var a=alerts();
document.getElementById('alarm').innerHTML=a.length?'<span class="badge bExp">! '+a.length+'</span>':'';
if(tab==='home')startClock()}
function loginView(){var h='<div class="loginwrap"><div class="card"><h2>МедСмена</h2><p>Вход по PIN</p>';
DB.users.forEach(function(u){h+='<button class="bigbtn" onclick="loginPick('+u.id+')">👤 <b>'+esc(u.name)+'</b></button>'});
if(loginFor)h+='<p><input id="pinIn" type="password" placeholder="PIN"></p><p><button class="btn wide" onclick="loginDo()">Войти</button></p>';
h+='<button class="btn sec wide" onclick="regView()">➕ Зарегистрироваться</button></div></div>';return h}
function loginPick(id){var u=DB.users.find(function(x){return x.id===id});
if(!u.pin){DB.session=id;save();go('home');return}
loginFor=id;render()}
function loginDo(){var u=DB.users.find(function(x){return x.id===loginFor});
var v=document.getElementById('pinIn').value;
if(v!==u.pin)return alert('Неверный PIN');
DB.session=u.id;loginFor=null;save();go('home')}
function regView(){openDlg('<h3>Анкета</h3><label>ФИО</label><input id="rName"><label>PIN</label><input id="rPin" type="password" inputmode="numeric"><label>Повторите PIN</label><input id="rPin2" type="password" inputmode="numeric"><p><button class="btn" onclick="regDo()">Создать</button></p>')}
function regDo(){var n=document.getElementById('rName').value.trim();
if(!n)return alert('Введите ФИО');
var p1=document.getElementById('rPin').value,p2=document.getElementById('rPin2').value;
if(p1!==p2)return alert('PIN не совпадает');
var role=DB.users.length?'user':'admin';
DB.users.push({id:uid(),name:n,pin:p1,role:role,cars:[],bags:[]});
DB.session=DB.users[DB.users.length-1].id;save();closeDlg();go('home');
if(role==='admin')alert('Вы администратор')}
var clockTimer=null;
function startClock(){if(clockTimer)clearInterval(clockTimer);tick();clockTimer=setInterval(tick,1000)}
function tick(){var e=document.getElementById('clk');if(!e)return;var d=new Date();
e.innerHTML='<b>'+d.toLocaleTimeString('ru-RU')+'</b><br>'+d.toLocaleDateString('ru-RU',{weekday:'long',day:'numeric',month:'long'})}
function homeView(){var a=alerts();var h='<div class="card" id="clk"></div>';
h+='<div class="card"><b>🔔 Тревоги</b>';
if(a.length){h+='<table>';a.forEach(function(x){h+='<tr><td><span class="badge '+x.l+'">!</span> '+esc(x.t)+'</td></tr>'});h+='</table>'}
else h+='<p>✅ Всё в порядке</p>';
h+='</div><div class="card"><b>📨 Последние отчёты</b>';
var reps=DB.reports.slice(-6).reverse();
if(reps.length){h+='<table>';reps.forEach(function(r){h+='<tr><td><span class="badge '+(r.status==='green'?'bG':r.status==='yellow'?'bY':'bR')+'">'+(r.status==='green'?'без замечаний':r.status==='yellow'?'с замечаниями':'КРАСНЫЙ')+'</span> '+esc(r.car)+' · '+esc(r.user)+'<br><small>'+new Date(r.ts).toLocaleString('ru-RU',{day:'2-digit',month:'2-digit',hour:'2-digit',minute:'2-digit'})+(r.remarks?' · '+esc(r.remarks):'')+'</small></td></tr>'});h+='</table>'}
else h+='<p>Отчётов пока нет</p>';
h+='</div>';return h}
function bagsView(){if(curBag)return bagView();
var h='<button class="btn" onclick="openBagDlg()">+ Сумка</button>';
if(!DB.bags.length)h+='<p>Сумок пока нет</p>';
DB.bags.forEach(function(b){var bad=0;
b.items.forEach(function(it){if(it.expiry&&daysLeft(it.expiry)<=S().warnDays)bad++});
h+='<div class="card"><b>👜 '+esc(b.name)+'</b> · '+b.items.length+' поз.'+(bad?' <span class="badge bSoon">⚠ '+bad+'</span>':'')+'<br><button class="btn sec mini" onclick="curBag='+b.id+';render()">Открыть</button> <button class="btn del" onclick="delBag('+b.id+')">🗑</button></div>'});
return h}
function openBagDlg(){openDlg('<h3>Новая сумка</h3><label>Название</label><input id="bName"><p><button class="btn" onclick="saveBagDlg()">Создать</button></p>')}
function saveBagDlg(){var n=document.getElementById('bName').value.trim();
if(!n)return alert('Введите название');
DB.bags.push({id:uid(),name:n,items:[]});save();closeDlg();render()}
function delBag(id){if(confirm('Удалить сумку?')){DB.bags=DB.bags.filter(function(b){return b.id!==id});save();render()}}
function bagView(){var b=DB.bags.find(function(x){return x.id===curBag});
if(!b){curBag=null;return bagsView()}
var h='<button class="btn sec" onclick="curBag=null;render()">← Сумки</button><h3>👜 '+esc(b.name)+'</h3>';
h+='<button class="btn" onclick="openItemDlg('+b.id+',-1)">+ Позиция</button>';
h+='<table><tr><th>Наименование</th><th>Кол-во</th><th>Срок</th><th>Статус</th><th></th></tr>';
b.items.forEach(function(it,i){h+='<tr class="'+rowCls(it.expiry)+'"><td>'+esc(it.name)+'<br><small>'+esc(it.spec||'')+'</small></td><td>'+it.qty+' '+esc(it.unit)+'</td><td><input type="date" style="width:140px" value="'+(it.expiry||'')+'" onchange="setExp('+curBag+','+i+',this.value)"></td><td>'+badgeExp(it.expiry)+'</td><td><button class="btn del" onclick="delItem('+curBag+','+i+')">🗑</button></td></tr>'});
h+='</table>';return h}
function setExp(bid,i,v){var b=DB.bags.find(function(x){return x.id===bid});b.items[i].expiry=v;save();render()}
function delItem(bid,i){var b=DB.bags.find(function(x){return x.id===bid});
if(confirm('Удалить позицию?')){b.items.splice(i,1);save();render()}}
function openItemDlg(bid,idx){var it=idx<0?{}:DB.bags.find(function(x){return x.id===bid}).items[idx];
openDlg('<h3>Позиция</h3><label>Название</label><input id="iName" value="'+esc(it.name||'')+'"><label>Форма</label><input id="iSpec" value="'+esc(it.spec||'')+'"><div class="row"><div><label>Кол-во</label><input id="iQty" type="number" value="'+(it.qty||1)+'"></div><div><label>Ед.</label><input id="iUnit" value="'+esc(it.unit||'шт')+'"></div></div><label>Срок годности</label><input id="iExp" type="date" value="'+(it.expiry||'')+'"><p><button class="btn" onclick="saveItemDlg('+bid+','+idx+')">Сохранить</button></p>')}
function saveItemDlg(bid,idx){var b=DB.bags.find(function(x){return x.id===bid});
var o={name:document.getElementById('iName').value.trim(),spec:document.getElementById('iSpec').value.trim(),qty:+document.getElementById('iQty').value||1,unit:document.getElementById('iUnit').value.trim()||'шт',expiry:document.getElementById('iExp').value};
if(!o.name)return alert('Введите название');
if(idx<0)b.items.push(o);else b.items[idx]=o;save();closeDlg();render()}
function carsView(){if(curCar)return carView();var h=isBoss()?'<button class="btn" onclick="openCarDlg()">+ Машина</button>':'';
if(isBoss()){var tasks=DB.tasks.filter(function(t){return !t.done});
if(tasks.length){h+='<div class="card"><b>📌 Задачи</b><table>';tasks.forEach(function(t){h+='<tr><td>'+esc(t.text)+'</td><td><button class="btn sec mini" onclick="doneTask('+t.id+')">✔</button></td></tr>'});h+='</table></div>'}}
if(!DB.cars.length)h+='<p>Машин пока нет</p>';
DB.cars.forEach(function(c){var df=0;
c.equip.forEach(function(e){if(e.status==='def')df++});
h+='<div class="card"><b>🚑 '+esc(c.name)+'</b> · оборуд. '+c.equip.length+(df?' <span class="badge bExp">дефекты: '+df+'</span>':'')+' · укладок: '+c.kits.length+'<br><button class="btn sec mini" onclick="curCar='+c.id+';curKit=null;render()">Открыть</button></div>'});
return h}
function carView(){var c=DB.cars.find(function(x){return x.id===curCar});
if(!c){curCar=null;return carsView()}
var h='<button class="btn sec" onclick="curCar=null;render()">← Машины</button><h3>🚑 '+esc(c.name)+'</h3>';
h+='<button class="btn" onclick="openRep('+c.id+')">📨 Отчёт по смене</button>';
if(curKit)return h+kitView(c);
h+='<div class="card"><b>Оборудование</b><table><tr><th>Инв. №</th><th>Наименование</th><th>Статус</th><th>Заряд</th></tr>';
c.equip.forEach(function(e){h+='<tr class="'+(e.status==='def'?'exp':'')+'"><td>'+esc(e.ovm||'—')+'</td><td>'+esc(e.name)+'</td><td>'+(isBoss()?'<select onchange="setEq('+c.id+','+e.id+',this.value)"><option value="ok"'+(e.status==='ok'?' selected':'')+'>исправен</option><option value="def"'+(e.status==='def'?' selected':'')+'>дефект</option><option value="miss"'+(e.status==='miss'?' selected':'')+'>нет</option></select>':(e.status==='ok'?'<span class="badge bOk">исправен</span>':'<span class="badge bExp">'+e.status+'</span>'))+'</td><td><input style="width:80px" value="'+esc(e.charge||'')+'" onchange="setCh('+c.id+','+e.id+',this.value)"></td></tr>'});
h+='</table></div><div class="card"><b>Укладки</b>';
c.kits.forEach(function(k){var bad=0;
k.items.forEach(function(it){if(it.expiry&&daysLeft(it.expiry)<=S().warnDays)bad++});
h+='<p>🧰 <b>'+esc(k.name)+'</b> · '+k.items.length+' поз.'+(bad?' <span class="badge bSoon">⚠ '+bad+'</span>':'')+' <button class="btn sec mini" onclick="curKit='+k.id+';render()">Открыть</button></p>'});
h+='</div><div class="card"><b>Отчёты по машине</b>';
var reps=DB.reports.filter(function(r){return r.carId===c.id}).slice(-10).reverse();
if(reps.length){h+='<table>';reps.forEach(function(r){h+='<tr><td><span class="badge '+(r.status==='green'?'bG':r.status==='yellow'?'bY':'bR')+'">'+r.status+'</span> '+new Date(r.ts).toLocaleString('ru-RU',{day:'2-digit',month:'2-digit',hour:'2-digit',minute:'2-digit'})+' · '+esc(r.user)+(isBoss()&&!r.viewed?' <button class="btn sec mini" onclick="viewReport('+r.id+')">👁</button>':'')+'</td></tr>'});h+='</table>'}
else h+='<p>Нет отчётов</p>';
h+='</div>';return h}
function kitView(c){var k=c.kits.find(function(x){return x.id===curKit});
if(!k){curKit=null;return carView(c)}
var h='<button class="btn sec" onclick="curKit=null;render()">← Укладки</button><h4>🧰 '+esc(k.name)+'</h4>';
h+='<button class="btn" onclick="openKitItem('+c.id+','+k.id+',-1)">+ Позиция</button>';
h+='<table><tr><th>Наименование</th><th>Кол-во</th><th>Срок</th><th>Статус</th><th></th></tr>';
k.items.forEach(function(it,i){h+='<tr class="'+rowCls(it.expiry)+'"><td>'+esc(it.name)+'</td><td>'+it.qty+' '+esc(it.unit)+'</td><td><input type="date" style="width:140px" value="'+(it.expiry||'')+'" onchange="setExpKit('+c.id+','+k.id+','+i+',this.value)"></td><td>'+badgeExp(it.expiry)+'</td><td><button class="btn del" onclick="delKitItem('+c.id+','+k.id+','+i+')">🗑</button></td></tr>'});
h+='</table>';return h}
function setEq(cid,eid,v){var c=DB.cars.find(function(x){return x.id===cid});
var e=c.equip.find(function(x){return x.id===eid});e.status=v;save();render()}
function setCh(cid,eid,v){var c=DB.cars.find(function(x){return x.id===cid});
var e=c.equip.find(function(x){return x.id===eid});e.charge=v;save()}
function setExpKit(cid,kid,i,v){var c=DB.cars.find(function(x){return x.id===cid});
var k=c.kits.find(function(x){return x.id===kid});k.items[i].expiry=v;save();render()}
function delKitItem(cid,kid,i){var c=DB.cars.find(function(x){return x.id===cid});
var k=c.kits.find(function(x){return x.id===kid});
if(confirm('Удалить?')){k.items.splice(i,1);save();render()}}
function openKitItem(cid,kid,idx){var k=DB.cars.find(function(x){return x.id===cid}).kits.find(function(x){return x.id===kid});
var it=idx<0?{}:k.items[idx];
openDlg('<h3>Позиция укладки</h3><label>Название</label><input id="kName" value="'+esc(it.name||'')+'"><div class="row"><div><label>Кол-во</label><input id="kQty" type="number" value="'+(it.qty||1)+'"></div><div><label>Ед.</label><input id="kUnit" value="'+esc(it.unit||'шт')+'"></div></div><label>Срок</label><input id="kExp" type="date" value="'+(it.expiry||'')+'"><p><button class="btn" onclick="saveKitItem('+cid+','+kid+','+idx+')">Сохранить</button></p>')}
function saveKitItem(cid,kid,idx){var k=DB.cars.find(function(x){return x.id===cid}).kits.find(function(x){return x.id===kid});
var o={name:document.getElementById('kName').value.trim(),qty:+document.getElementById('kQty').value||1,unit:document.getElementById('kUnit').value.trim()||'шт',expiry:document.getElementById('kExp').value,spec:''};
if(!o.name)return alert('Введите название');
if(idx<0)k.items.push(o);else k.items[idx]=o;save();closeDlg();render()}
function openRep(cid){repCar=cid;var c=DB.cars.find(function(x){return x.id===cid});
var h='<h3>📨 Отчёт по смене · '+esc(c.name)+'</h3>';
h+='<div class="row"><div><label>№ бригады</label><input id="rpBrig" inputmode="numeric"></div><div><label>Сумка</label><select id="rpBag">';
DB.bags.forEach(function(b){h+='<option>'+esc(b.name)+'</option>'});
h+='</select></div></div>';
h+='<div class="row"><div><label>ЭКГ №</label><select id="rpEcg">';
DB.ecg.forEach(function(n){h+='<option>'+esc(n)+'</option>'});
h+='</select></div><div><label>Заряд ЭКГ</label><input id="rpEcgCh"></div></div>';
h+='<label>Примечания</label><textarea id="rpRem"></textarea>';
h+='<p><button class="btn wide" onclick="submitRep(\'ok\')">✅ Без замечаний</button>';
h+='<button class="btn sec wide" onclick="submitRep(\'rem\')">⚠ Есть замечания</button></p>';
openDlg(h)}
function submitRep(mode){if(mode==='rem'&&!document.getElementById('rpRem').value.trim())return alert('Опишите замечания');
var c=DB.cars.find(function(x){return x.id===repCar});var u=me();
var exp=soonList();
var st=(exp.length>0)?'red':(mode==='rem'?'yellow':'green');
DB.reports.push({id:uid(),ts:Date.now(),kind:'shift',carId:c.id,car:c.name,userId:u.id,user:u.name,brigade:document.getElementById('rpBrig').value.trim(),bagNum:document.getElementById('rpBag').value,ecgNum:document.getElementById('rpEcg').value,ecgCharge:document.getElementById('rpEcgCh').value.trim(),status:st,remarks:document.getElementById('rpRem').value.trim(),expired:exp,viewed:false});
save();closeDlg();render();alert('Отчёт отправлен: '+st)}
function viewReport(id){var r=DB.reports.find(function(x){return x.id===id});r.viewed=true;
r.expired.forEach(function(d){DB.tasks.push({id:uid(),ts:Date.now(),text:r.car+': заменить — '+d,done:false})});
if(r.remarks)DB.tasks.push({id:uid(),ts:Date.now(),text:r.car+': замечание — '+r.remarks,done:false});
save();render();alert('Задачи созданы')}
function doneTask(id){var t=DB.tasks.find(function(x){return x.id===id});t.done=true;save();render()}
function setView(){var u=me();

function logout(){DB.session=null;save();go('home')}
function resetDB(){if(confirm('Полный сброс базы?')){localStorage.removeItem(LS);location.reload()}}
function togResp(kind,id,on){var u=me();u[kind]=u[kind]||[];
if(on){if(u[kind].indexOf(id)<0)u[kind].push(id)}
else u[kind]=u[kind].filter(function(x){return x!==id});save()}
function exportDB(){var a=document.createElement('a');
a.href=URL.createObjectURL(new Blob([JSON.stringify(DB)],{type:'application/json'}));
a.download='medshift-'+todayStr()+'.json';a.click()}
function importDB(inp){var f=inp.files[0];if(!f)return;var r=new FileReader();
r.onload=function(){try{DB=JSON.parse(r.result);save();location.reload()}catch(e){alert('Ошибка файла')}};
r.readAsText(f)}

function openRespDlg(uid){var u=DB.users.find(function(x){return x.id===uid});
var h='<h3>Ответственность: '+esc(u.name)+'</h3>';
h+='<label>Роль</label><select id="rsRole"><option value="user"'+(u.role==='user'?' selected':'')+'>сотрудник</option><option value="lead"'+(u.role==='lead'?' selected':'')+'>руководитель</option><option value="admin"'+(u.role==='admin'?' selected':'')+'>админ</option></select>';

h+='<label>Сумки</label>';
DB.bags.forEach(function(b){h+='<label><input type="checkbox" style="width:auto"'+((u.bags||[]).indexOf(b.id)>=0?' checked':'')+' data-k="bags" data-id="'+b.id+'"> '+esc(b.name)+'</label>'});

function saveRespDlg(uid){var u=DB.users.find(function(x){return x.id===uid});
u.role=document.getElementById('rsRole').value;u.cars=[];u.bags=[];
var boxes=dlgBody.querySelectorAll('input[type=checkbox]');
for(var i=0;i<boxes.length;i++){var b=boxes[i];if(!b.checked)continue;
var id=+b.getAttribute('data-id');
if(b.getAttribute('data-k')==='cars')u.cars.push(id);else u.bags.push(id)}
save();closeDlg();render()}

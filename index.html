<style>
:root{--ac:#0b5394;--bg:#f4f6f8;--card:#fff;--tx:#111;--mut:#666;--bd:#ddd;--sh:0 1px 3px rgba(0,0,0,.08)}
*{box-sizing:border-box}
body{font-family:system-ui,-apple-system,sans-serif;margin:0;background:var(--bg);color:var(--tx);line-height:1.4}
header{background:var(--ac);color:#fff;padding:10px 14px;font-size:18px;display:flex;align-items:center;justify-content:space-between;gap:8px}
header .h-right{display:flex;align-items:center;gap:8px;font-size:13px;opacity:.9}
nav{display:flex;background:var(--card);border-bottom:1px solid var(--bd);position:sticky;top:0;z-index:10;box-shadow:var(--sh)}
nav button{flex:1;padding:12px 2px;border:0;background:none;font-size:13px;color:var(--tx);cursor:pointer}
nav button.on{box-shadow:inset 0 -3px 0 var(--ac);font-weight:600;color:var(--ac)}
main{padding:12px;max-width:900px;margin:0 auto}
.card{background:var(--card);border:1px solid var(--bd);border-radius:10px;padding:14px;margin-bottom:10px;box-shadow:var(--sh)}
.tbl-wrap{overflow-x:auto;-webkit-overflow-scrolling:touch}
table{width:100%;border-collapse:collapse;font-size:14px;min-width:480px}
td,th{padding:6px 4px;border-bottom:1px solid var(--bd);text-align:left;vertical-align:top}
th{color:var(--mut);font-size:12px;text-transform:uppercase;letter-spacing:.3px}
.badge{border-radius:8px;padding:2px 8px;font-size:12px;white-space:nowrap;display:inline-block}
.bExp{background:#ffd2d2;color:#7a1010}.bSoon{background:#ffe0c2;color:#8a4b00}
.bWarn{background:#fff3c2;color:#7a6000}.bOk{background:#d9f2d9;color:#1b5e20}
.bG{background:#2e7d32;color:#fff}.bY{background:#f9a825;color:#332}.bR{background:#c62828;color:#fff}
tr.exp{background:#ffe3e3}tr.soon{background:#ffedd9}
.btn{background:var(--ac);color:#fff;border:0;border-radius:8px;padding:9px 14px;font-size:15px;margin:4px 4px 4px 0;cursor:pointer;transition:opacity .15s}
.btn:hover{opacity:.85}
.btn.sec{background:transparent;color:var(--ac);border:1px solid var(--ac)}
.btn.del{background:transparent;color:#c62828;border:1px solid #c62828;padding:4px 8px;margin:0;cursor:pointer}
.btn.mini{padding:4px 8px;margin:0;font-size:13px}
.btn.wide{width:100%;padding:12px;margin:4px 0}
input,select,textarea{padding:8px;border:1px solid var(--bd);border-radius:8px;font-size:15px;width:100%;box-sizing:border-box;font-family:inherit}
textarea{min-height:70px;resize:vertical}
label{font-size:13px;color:var(--mut);display:block;margin:6px 0 3px}
.row{display:flex;gap:8px}.row>*{flex:1}
.search-box{margin:8px 0;position:relative}
.search-box input{padding-left:32px}
.search-box::before{content:'🔍';position:absolute;left:8px;top:50%;transform:translateY(-50%);font-size:14px}
.loginwrap{max-width:420px;margin:40px auto}
.bigbtn{display:block;width:100%;margin:6px 0;padding:14px;border-radius:12px;border:1px solid var(--bd);background:var(--card);font-size:16px;text-align:left;cursor:pointer}
.bigbtn:hover{border-color:var(--ac)}
#dlg::backdrop{background:rgba(0,0,0,.45)}
#dlg{border:0;border-radius:12px;padding:0;box-shadow:0 8px 32px rgba(0,0,0,.2)}
.dlg-inner{padding:20px;max-height:85vh;overflow-y:auto}
.dlg-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}
.dlg-close{background:none;border:0;font-size:22px;cursor:pointer;color:var(--mut);padding:0 4px;line-height:1}
.stat{display:flex;gap:8px;flex-wrap:wrap}
.stat .s-card{flex:1;min-width:80px;text-align:center;padding:10px;border-radius:8px;background:var(--bg)}
.stat .s-num{font-size:22px;font-weight:700}
.stat .s-lbl{font-size:11px;color:var(--mut)}
.chk-row{display:flex;align-items:center;gap:6px;margin:4px 0}
.chk-row input{width:auto}
@media(max-width:600px){header{font-size:16px}main{padding:8px}.card{padding:10px}}
</style>

function uid(){return DB.seq++}
function esc(s){s=(s==null?'':String(s));
return s.split('&').join('&amp;').split('<').join('&lt;').split('>').join('&gt;').split('"').join('&quot;')}

function me(){for(var i=0;i<DB.users.length;i++)if(DB.users[i].id===DB.session)return DB.users[i];return null}
function isBoss(){var u=me();return !!u&&(u.role==='admin'||u.role==='lead')}

function todayStr(){return new Date().toISOString().slice(0,10)}
function daysLeft(iso){var d=new Date(iso+'T00:00:00'),t=new Date();t.setHours(0,0,0,0);return Math.round((d-t)/864e5)}
function badgeExp(iso){if(!iso)return '<span class="badge bWarn">нет срока</span>';var d=daysLeft(iso);
if(d<0)return '<span class="badge bExp">просрочен '+(-d)+' дн</span>';
if(d<=S().warnDays)return '<span class="badge bSoon">осталось '+d+' дн</span>';
if(d<=30)return '<span class="badge bWarn">'+d+' дн</span>';
return '<span class="badge bOk">'+d+' дн</span>'}
function rowCls(iso){if(!iso)return '';var d=daysLeft(iso);if(d<0)return 'exp';if(d<=S().warnDays)return 'soon';return ''}
function matchSearch(s){if(!searchQuery)return true;return (s||'').toLowerCase().indexOf(searchQuery.toLowerCase())>=0}
function myBags(){var u=me();if(!u)return [];if(isBoss())return DB.bags;
return DB.bags.filter(function(b){return (u.bags||[]).indexOf(b.id)>=0})}
function myCars(){var u=me();if(!u)return [];if(isBoss())return DB.cars;
return DB.cars.filter(function(c){return (u.cars||[]).indexOf(c.id)>=0})}

function carExpired(carId){
  var c=DB.cars.find(function(x){return x.id===carId});if(!c)return[];
  var r=[];c.kits.forEach(function(k){k.items.forEach(function(it){
    if(it.expiry&&daysLeft(it.expiry)<=S().warnDays)r.push(k.name+': '+it.name)})});
  return r}
function soonList(){var r=[];
myBags().forEach(function(b){b.items.forEach(function(it){if(it.expiry&&daysLeft(it.expiry)<=S().warnDays)r.push(b.name+': '+it.name)})});
myCars().forEach(function(c){c.kits.forEach(function(k){k.items.forEach(function(it){if(it.expiry&&daysLeft(it.expiry)<=S().warnDays)r.push(c.name+' / '+k.name+': '+it.name)})})});
return r}
function alerts(){var a=[];var so=soonList();
if(so.length)a.push({t:'Истекает/просрочено: '+so.length+' поз.',l:'bSoon'});
DB.cars.forEach(function(c){c.equip.forEach(function(e){if(e.status==='def')a.push({t:c.name+': дефект '+e.name,l:'bExp'});if(e.status==='miss')a.push({t:c.name+': отсутствует '+e.name,l:'bExp'})})});
if(isBoss()){var p=0;DB.reports.forEach(function(r){if(!r.viewed)p++});if(p)a.push({t:'Непросмотренных отчётов: '+p,l:'bWarn'})}
return a}

tabs.forEach(function(t){var b=document.createElement('button');
if(tab===t[0])b.className='on';b.textContent=t[1];b.onclick=function(){go(t[0])};nav.appendChild(b)})}
function go(t){tab=t;searchQuery='';renderNav();render()}
function render(){var u=me();
if(!u){main.innerHTML=loginView();document.getElementById('alarm').innerHTML='';return}
if(tab==='home')main.innerHTML=homeView();
else if(tab==='bags')main.innerHTML=bagsView();
else if(tab==='cars')main.innerHTML=carsView();
else main.innerHTML=setView();
var a=alerts();
document.getElementById('alarm').innerHTML=a.length?'<span class="badge bExp">! '+a.length+'</span>':'';
if(tab==='home')startClock()}

/* ===== ЛОГИН ===== */
function loginView(){var h='<div class="loginwrap"><div class="card"><h2>МедСмена</h2><p>Вход по PIN</p>';
DB.users.forEach(function(u){h+='<button class="bigbtn" onclick="loginPick('+u.id+')">\u{1F464} <b>'+esc(u.name)+'</b></button>'});
if(loginFor)h+='<p><input id="pinIn" type="password" placeholder="PIN" inputmode="numeric" autofocus></p><p><button class="btn wide" onclick="loginDo()">Войти</button></p>';
h+='<button class="btn sec wide" onclick="regView()">\u{2795} Зарегистрироваться</button></div></div>';return h}
function loginPick(id){var u=DB.users.find(function(x){return x.id===id});
if(!u.pin){DB.session=id;save();go('home');return}
loginFor=id;render();
setTimeout(function(){var p=document.getElementById('pinIn');if(p)p.focus()},50)}
function loginDo(){var u=DB.users.find(function(x){return x.id===loginFor});
var v=document.getElementById('pinIn').value;
if(v!==u.pin)return alert('Неверный PIN');

function submitRep(mode){if(mode==='rem'&&!document.getElementById('rpRem').value.trim())return alert('Опишите замечания');
var c=DB.cars.find(function(x){return x.id===repCar});var u=me();
var exp=carExpired(c.id);
var st=exp.length>0?'red':(mode==='rem'?'yellow':'green');
var eqCheck={};
c.equip.forEach(function(e,i){var cb=document.getElementById('eqCheck'+i);if(cb)eqCheck[e.name]=cb.checked});
var remarks=document.getElementById('rpRem').value.trim();
DB.reports.push({id:uid(),ts:Date.now(),kind:'shift',carId:c.id,car:c.name,userId:u.id,user:u.name,brigade:document.getElementById('rpBrig').value.trim(),bagNum:document.getElementById('rpBag').value,ecgNum:document.getElementById('rpEcg').value,ecgCharge:document.getElementById('rpEcgCh').value.trim(),status:st,remarks:remarks,expired:exp,eqCheck:eqCheck,viewed:false});
save();closeDlg();render();
var stTxt=st==='green'?'без замечаний':st==='yellow'?'с замечаниями':'КРАСНЫЙ (есть просрочка)';
alert('Отчёт отправлен: '+stTxt)}
function viewReport(id){var r=DB.reports.find(function(x){return x.id===id});r.viewed=true;
r.expired.forEach(function(d){DB.tasks.push({id:uid(),ts:Date.now(),text:r.car+': заменить \u2014 '+d,done:false})});
if(r.remarks)DB.tasks.push({id:uid(),ts:Date.now(),text:r.car+': замечание \u2014 '+r.remarks,done:false});
save();render();
var h='<h3>Отчёт '+esc(r.car)+' \u00b7 '+new Date(r.ts).toLocaleString('ru-RU')+'</h3>';
h+='<p><b>Сотрудник:</b> '+esc(r.user)+(r.brigade?' \u00b7 бригада '+esc(r.brigade):'')+'</p>';
h+='<p><b>Статус:</b> <span class="badge '+(r.status==='green'?'bG':r.status==='yellow'?'bY':'bR')+'">'+r.status+'</span></p>';
if(r.ecgNum)h+='<p><b>ЭКГ:</b> '+esc(r.ecgNum)+(r.ecgCharge?' \u00b7 заряд '+esc(r.ecgCharge):'')+'</p>';
if(r.bagNum)h+='<p><b>Сумка:</b> '+esc(r.bagNum)+'</p>';
if(r.expired.length){h+='<p><b>Просроченные:</b><br>'+r.expired.map(esc).join('<br>')+'</p>'}
if(r.remarks)h+='<p><b>Замечания:</b> '+esc(r.remarks)+'</p>';
h+='<p><button class="btn" onclick="window.print()">\u{1F5a8} Печать</button></p>';
openDlg(h);
alert('Задачи созданы')}
function doneTask(id){var t=DB.tasks.find(function(x){return x.id===id});t.done=true;save();render()}

function logout(){DB.session=null;save();go('home')}
function resetDB(){if(confirm('Полный сброс базы? Все данные будут удалены.')){localStorage.removeItem(LS);location.reload()}}
function delUser(id){if(confirm('Удалить сотрудника?')){DB.users=DB.users.filter(function(u){return u.id!==id});save();render()}}
function togResp(kind,id,on){var u=me();u[kind]=u[kind]||[];
if(on){if(u[kind].indexOf(id)<0)u[kind].push(id)}
else u[kind]=u[kind].filter(function(x){return x!==id});save()}
function exportDB(){var a=document.createElement('a');
a.href=URL.createObjectURL(new Blob([JSON.stringify(DB)],{type:'application/json'}));
a.download='medshift-'+todayStr()+'.json';a.click()}
function importDB(inp){var f=inp.files[0];if(!f)return;var r=new FileReader();
r.onload=function(){try{DB=JSON.parse(r.result);if(!DB.cars)DB.cars=[];DB.cars.forEach(function(c){if(!c.kits)c.kits=[];if(!c.equip)c.equip=[]});save();location.reload()}catch(e){alert('Ошибка файла')}};
r.readAsText(f)}

function openRespDlg(userId){var u=DB.users.find(function(x){return x.id===userId});

h+='<label>Машины</label>';
DB.cars.forEach(function(c){h+='<div class="chk-row"><input type="checkbox"'+((u.cars||[]).indexOf(c.id)>=0?' checked':'')+' data-k="cars" data-id="'+c.id+'"> '+esc(c.name)+'</div>'});
h+='<label>Сумки</label>';
DB.bags.forEach(function(b){h+='<div class="chk-row"><input type="checkbox"'+((u.bags||[]).indexOf(b.id)>=0?' checked':'')+' data-k="bags" data-id="'+b.id+'"> '+esc(b.name)+'</div>'});
h+='<p><button class="btn" onclick="saveRespDlg('+userId+')">Сохранить</button></p>';
openDlg(h)}
function saveRespDlg(userId){var u=DB.users.find(function(x){return x.id===userId});
u.role=document.getElementById('rsRole').value;u.cars=[];u.bags=[];
var boxes=dlgBody.querySelectorAll('input[type=checkbox]');
for(var i=0;i<boxes.length;i++){var b=boxes[i];if(!b.checked)continue;
var id=+b.getAttribute('data-id');
if(b.getAttribute('data-k')==='cars')u.cars.push(id);else u.bags.push(id)}
save();closeDlg();render()}

<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>МедСмена</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<script>
window.__errs=[];
addEventListener('error',function(e){var m=document.getElementById('main');if(!m)return;
var txt=(e.target&&e.target.tagName)?('Не загрузился файл: '+(e.target.src||e.target.href)):('Ошибка JS: '+e.message+' | файл: '+(e.filename||'')+', строка '+e.lineno);
window.__errs.push(txt);
m.innerHTML='<div class="card"><b>Найдено ошибок: '+window.__errs.length+'</b><br>'+window.__errs.map(function(t,i){return (i+1)+'. '+t}).join('<br>')+'</div>'},true);
</script>
<header>МедСмена <span id="alarm" onclick="go('home')"></span></header>
<nav id="nav"></nav>
<main id="main"></main>
<dialog id="dlg" style="width:min(680px,95%)"><div id="dlgBody"></div></dialog>
<script src="seed.js"></script>
<script src="core.js"></script>
<script src="import.js"></script>
<script src="packs.js"></script>
<script src="cars.js"></script>
<script src="starter.js"></script>
</body>
</html>

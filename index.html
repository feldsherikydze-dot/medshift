<style>
:root{--ac:#0b5394;--bg:#f4f6f8;--card:#fff;--tx:#111;--mut:#666;--bd:#ddd;--fs:14px;--vh:1vh;--kb:0px;--sab:env(safe-area-inset-bottom,0px)}
body.dark{--bg:#12161c;--card:#1c232c;--tx:#e8e8e8;--mut:#9aa5b1;--bd:#2a3340}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{font-family:system-ui;margin:0;background:var(--bg);color:var(--tx);overflow-x:hidden;-webkit-text-size-adjust:100%;font-size:var(--fs)}
header{background:var(--ac);color:#fff;padding:8px 12px;font-size:calc(var(--fs) + 2px);display:flex;align-items:center;justify-content:space-between;gap:8px;flex-wrap:wrap}
.hdr-left{display:flex;align-items:center;gap:8px}
.hdr-user{font-size:calc(var(--fs) - 1px);opacity:.9;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:120px}
nav{display:flex;background:var(--card);border-bottom:1px solid var(--bd);position:sticky;top:0;z-index:10;overflow-x:auto;-webkit-overflow-scrolling:touch}
nav button{flex:1 0 auto;padding:10px 6px;border:0;background:none;font-size:calc(var(--fs) - 3px);color:var(--tx);white-space:nowrap;min-width:0}
nav button.on{box-shadow:inset 0 -3px 0 var(--ac);font-weight:600}
main{padding:8px 8px calc(80px + var(--sab) + var(--kb,0px));max-width:900px;margin:0 auto;width:100%}
.card{background:var(--card);border:1px solid var(--bd);border-radius:10px;padding:10px;margin-bottom:8px;overflow:hidden;word-wrap:break-word}
.card.clickable{cursor:pointer}.card.clickable:active{opacity:.85}
table{width:100%;border-collapse:collapse;font-size:calc(var(--fs) - 1px);table-layout:fixed}
td,th{padding:5px 4px;border-bottom:1px solid var(--bd);text-align:left;vertical-align:middle;word-wrap:break-word;overflow-wrap:break-word;overflow:hidden;text-overflow:ellipsis}
.badge{border-radius:8px;padding:2px 6px;font-size:calc(var(--fs) - 3px);white-space:nowrap;display:inline-block}
.bExp{background:#ffd2d2;color:#7a1010}.bSoon{background:#ffe0c2;color:#8a4b00}
.bWarn{background:#fff3c2;color:#7a6000}.bOk{background:#d9f2d9;color:#1b5e20}
.bG{background:#2e7d32;color:#fff}.bY{background:#f9a825;color:#332}.bR{background:#c62828;color:#fff}
tr.exp{background:#ffe3e3}tr.soon{background:#ffedd9}
tr.highlight{animation:hlPulse 1.5s ease-in-out 3}
@keyframes hlPulse{0%,100%{background:transparent}50%{background:#fff3c2}}
.btn{background:var(--ac);color:#fff;border:0;border-radius:8px;padding:8px 12px;font-size:var(--fs);margin:3px 3px 3px 0;white-space:nowrap;max-width:100%}
button{touch-action:manipulation}.btn:active{transform:scale(.96)}
.btn.sec{background:transparent;color:var(--ac);border:1px solid var(--ac)}
.btn.del{background:transparent;color:#c62828;border:1px solid #c62828;padding:4px 8px;margin:0}
.btn.mini{padding:4px 8px;margin:0;font-size:calc(var(--fs) - 2px)}
.btn.wide{width:100%;padding:12px;margin:4px 0}
input,select,textarea{padding:8px;border:1px solid var(--bd);border-radius:8px;font-size:var(--fs);width:100%;box-sizing:border-box;background:var(--card);color:var(--tx);min-width:0}
textarea{min-height:60px;resize:vertical}
input[type=date]{width:130px!important;flex:none!important}
label{font-size:calc(var(--fs) - 2px);color:var(--mut);display:block;margin-top:4px}
.row{display:flex;gap:6px;flex-wrap:wrap}.row>*{flex:1 1 45%;min-width:0}
.prev{max-height:200px;overflow:auto;border:1px solid var(--bd);border-radius:8px;margin:6px 0;padding:4px;-webkit-overflow-scrolling:touch}
.loginwrap{max-width:400px;margin:20px auto;padding:0 8px}
.bigbtn{display:block;width:100%;margin:4px 0;padding:12px;border-radius:12px;border:1px solid var(--bd);background:var(--card);color:var(--tx);font-size:calc(var(--fs) + 1px);text-align:left;word-wrap:break-word}
.chatbox{height:260px;overflow:auto;background:var(--card);border:1px solid var(--bd);border-radius:10px;padding:6px;margin:6px 0;-webkit-overflow-scrolling:touch}
.msg{margin:3px 0;padding:5px 7px;border-radius:8px;background:var(--bg);font-size:calc(var(--fs) - 1px);word-wrap:break-word;overflow-wrap:break-word}
.msg b{color:var(--ac)}.msg small{color:var(--mut)}.chatIn{display:flex;align-items:flex-end;gap:6px;margin:8px 0;flex-wrap:nowrap}.chatIn textarea{flex:1 1 auto;min-width:0;resize:none;min-height:38px;max-height:100px;padding:8px;line-height:1.3;font-family:inherit;font-size:16px;box-sizing:border-box}.chatIn .btn{flex:0 0 auto;margin:0;padding:8px 16px}
.wgrid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.wgrid .card{margin-bottom:0}
.wgrid .span2{grid-column:span 2}
.clockWeather{display:flex;align-items:center;justify-content:space-between;gap:10px;cursor:pointer;padding:10px;background:var(--card);border:1px solid var(--bd);border-radius:10px;margin-bottom:8px}
.clockWeather:active{opacity:.85}
.cwLeft{display:flex;flex-direction:column;line-height:1.3}
.cwTime{font-size:calc(var(--fs) + 6px);font-weight:700;color:var(--tx)}
.cwDate{font-size:calc(var(--fs) - 2px);color:var(--mut)}
.cwRight{text-align:right;white-space:nowrap}
.cwTemp{font-size:calc(var(--fs) + 4px);font-weight:600}
.cwDesc{font-size:calc(var(--fs) - 3px);color:var(--mut)}.cwSeason{text-align:center;flex:0 0 auto;line-height:1.3;padding:0 4px;font-size:calc(var(--fs) + 3px);white-space:nowrap;max-width:45%;overflow:hidden;text-overflow:ellipsis}
.forecastGrid{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;margin-top:8px}
.fcDay{text-align:center;padding:6px 2px;background:var(--bg);border-radius:6px;font-size:calc(var(--fs) - 3px)}
.fcDay.today{background:var(--ac);color:#fff}
.fcDay .fcTemp{font-weight:700;font-size:calc(var(--fs) - 1px);margin-top:2px}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:1px;font-size:calc(var(--fs) - 4px)}
.cal div{padding:2px 0;text-align:center;border-radius:4px}
.cal .td{background:var(--ac);color:#fff;font-weight:700}
.cal .hd{color:var(--mut);font-weight:600}
.thumbs{display:flex;flex-wrap:wrap;gap:6px}
.thumbs img{width:100px;height:100px;object-fit:cover;border-radius:8px;border:1px solid var(--bd);cursor:pointer}
.toast{position:fixed;left:50%;bottom:18px;transform:translateX(-50%);background:#222;color:#fff;padding:8px 16px;border-radius:10px;font-size:calc(var(--fs) - 1px);opacity:0;pointer-events:none;transition:opacity .3s;z-index:99;max-width:92%;text-align:center;word-wrap:break-word}
.toast.show{opacity:1}
#dlg{margin:4px auto;max-height:calc(100vh - 8px);overflow:auto;width:calc(100% - 8px);border-radius:12px;border:1px solid var(--bd)}
#dlg::backdrop{background:rgba(0,0,0,.25)}
.photoDlgBody{display:flex;flex-direction:column;height:min(85vh,calc(100vh - 32px))}
.photoViewport{flex:1;min-height:0;overflow:hidden;position:relative;background:#000;border-radius:8px;touch-action:none;cursor:grab}
.photoViewport.grabbing{cursor:grabbing}
.photoViewport img{position:absolute;top:50%;left:50%;transform-origin:center center;user-select:none;-webkit-user-drag:none;pointer-events:none}
.photoZoomBar{flex-shrink:0;display:flex;align-items:center;gap:4px;margin-top:6px;justify-content:center;flex-wrap:wrap}
.photoZoomBar .btn{margin:0;padding:6px 10px;font-size:calc(var(--fs) + 1px);min-width:36px}
.photoZoomBar span{font-size:calc(var(--fs) - 3px);color:var(--mut);min-width:40px;text-align:center}
.photoBtns{flex-shrink:0;display:flex;gap:6px;margin-top:6px}
.photoBtns .btn{flex:1;margin:0}
.reportDetail p{margin:3px 0;font-size:calc(var(--fs) - 1px);word-wrap:break-word}
.reportDetail b{color:var(--ac)}
.reportDetail .rdSection{margin-top:8px;padding-top:6px;border-top:1px solid var(--bd)}
.reportDetail .rdDefect{color:#c62828;font-size:calc(var(--fs) - 2px);word-wrap:break-word}
.col-name{width:40%}.col-spec{width:20%}.col-qty{width:12%}.col-exp{width:18%}.col-act{width:10%}
.col-ovm{width:15%}.col-eqname{width:30%}.col-status{width:18%}.col-notes{width:18%}.col-mark{width:19%}
.editMode input,.editMode select{border-color:var(--ac);background:#fffde7}
body.dark .editMode input,body.dark .editMode select{background:#2a2a1a}
.tplHeader{display:flex;align-items:center;justify-content:space-between;padding:10px;cursor:pointer;border-radius:8px;margin-bottom:4px;background:var(--bg);transition:background .15s}
.tplHeader:hover{opacity:.85}
.tplHeader b{font-size:calc(var(--fs) + 1px)}
.tplHeader .tplCount{font-size:calc(var(--fs) - 2px);color:var(--mut)}
.tplBody{display:none;padding:4px 0}
.tplBody.open{display:block}
.searchBox{margin:6px 0;position:relative}
.searchBox input{padding-right:30px}
.searchClear{position:absolute;right:8px;top:50%;transform:translateY(-50%);background:none;border:0;color:var(--mut);font-size:16px;cursor:pointer;padding:0}
.drugResults{max-height:150px;overflow:auto;border:1px solid var(--bd);border-radius:8px;margin-top:4px;background:var(--card)}
.drugItem{padding:6px 8px;cursor:pointer;border-bottom:1px solid var(--bd);font-size:calc(var(--fs) - 1px)}
.drugItem:hover,.drugItem:active{background:var(--bg)}
.drugItem:last-child{border-bottom:0}
.drugItem .diName{font-weight:600;color:var(--ac)}
.drugItem .diSpec{color:var(--mut);font-size:calc(var(--fs) - 2px)}
.refSearch{position:sticky;top:0;z-index:5;background:var(--bg);padding:8px 0}
.refCard{background:var(--card);border:1px solid var(--bd);border-radius:10px;padding:12px;margin-bottom:8px}
.refCard h4{margin:0 0 6px;color:var(--ac)}
.refRow{display:flex;gap:8px;margin-bottom:4px;font-size:calc(var(--fs) - 1px)}
.refLabel{color:var(--mut);min-width:80px;flex-shrink:0}
.refVal{font-weight:500}
.refRx{background:var(--bg);border-radius:8px;padding:8px 10px;margin-top:8px;font-family:'Courier New',monospace;font-size:calc(var(--fs) - 1px);white-space:pre-wrap;word-break:break-word;border-left:3px solid var(--ac)}
.refAnalogs{margin-top:6px;font-size:calc(var(--fs) - 2px);color:var(--mut)}
.refAnalogs span{display:inline-block;background:var(--bg);border-radius:4px;padding:2px 6px;margin:2px 2px 0 0}
@media(max-width:480px){
header{padding:6px 10px}
.hdr-user{max-width:90px}
nav button{padding:8px 4px}

.card{padding:8px;border-radius:8px}
.btn{padding:7px 10px;margin:2px}
.btn.mini{padding:3px 6px}
.bigbtn{padding:10px}

.wgrid .span2{grid-column:span 1}
.clockWeather{padding:8px;gap:6px}

.thumbs img{width:80px;height:80px}
.chatbox{height:220px}
.msg{padding:4px 6px}
.row>*{flex:1 1 100%}
#dlg{width:calc(100% - 4px);margin:2px auto}
.loginwrap{margin:10px auto}
.col-name{width:35%}.col-spec{width:18%}.col-qty{width:12%}.col-exp{width:22%}.col-act{width:13%}
.col-ovm{width:12%}.col-eqname{width:28%}.col-status{width:20%}.col-notes{width:20%}.col-mark{width:20%}

.refLabel{min-width:60px}
}
@media(min-width:481px) and (max-width:768px){
main{padding:10px 10px calc(80px + var(--sab) + var(--kb,0px))}
.wgrid{grid-template-columns:1fr 1fr}
}
@media(min-width:769px){
main{padding:12px 12px calc(80px + var(--sab) + var(--kb,0px))}

.btn{padding:9px 14px}
.thumbs img{width:110px;height:110px}
.chatbox{height:280px}
#dlg{width:min(680px,95%);margin:8px auto}
}
</style>

n></td></tr>'}});h+='</tbody></table>';if(highlightItem){setTimeout(function(){highlightItem=null},4500)}return h}

function pickDrug(prefix,idx){
    var d=window['__drugs_'+prefix];
    if(!d||!d[idx])return;
    var item=d[idx];
    if(prefix==='pot_item')return pickPotDrug(idx);
    var resEl=document.getElementById(prefix+'_results');
    if(resEl)resEl.innerHTML='';
    var searchEl=document.getElementById(prefix+'_search');
    if(searchEl)searchEl.value='';
    if(prefix.indexOf('tpl_')===0){
        var tid=prefix.substring(4);
        if(tid==='bag'){DB.bagTypes[0].items.push({name:item.n,spec:item.s,unit:item.u,qty:1,potent:false})}else{var ki=parseInt(tid.replace('kit_','')||'0');if(!isNaN(ki))DB.kitTemplates[ki].items.push({name:item.n,spec:item.s,unit:item.u,qty:1,potent:tid.indexOf('kit_4')===0})}
        save();render();toast('✅ Добавлено в шаблон: '+item.n);
        return;
    }
    var nameEl=document.getElementById(prefix+'_name');
    var specEl=document.getElementById(prefix+'_spec');
    var unitEl=document.getElementById(prefix+'_unit');
    if(nameEl)nameEl.value=item.n;
    if(specEl)specEl.value=item.s;
    if(unitEl)unitEl.value=item.u;
    toast('✅ Подставлено: '+item.n);
}

function compressImage(f,cb){var r=new FileReader();r.onload=function(){var im=new Image();im.onload=function(){var max=1200;var w=im.width,h=im.height;if(w>max||h>max){var k=Math.min(max/w,max/h);w=Math.round(w*k);h=Math.round(h*k)}var cv=document.createElement('canvas');cv.width=w;cv.height=h;cv.getContext('2d').drawImage(im,0,0,w,h);cb(cv.toDataURL('image/jpeg',0.7))};im.src=r.result};r.readAsDataURL(f)}

function initPhotoViewer(){var port=document.getElementById('pvPort');var img=document.getElementById('pvImg');var label=document.getElementById('pvLabel');if(!port||!img)return;var scale=1,panX=0,panY=0,minScale=0.5,maxScale=8;var dragging=false,startX=0,startY=0,startPanX=0,startPanY=0;var lastPinchDist=0,lastPinchScale=1;function applyTransform(){img.style.transform='translate(calc(-50% + '+panX+'px), calc(-50% + '+panY+'px)) scale('+scale+')';label.textContent=Math.round(scale*100)+'%'}function clampPan(){var pw=port.clientWidth,ph=port.clientHeight;var iw=img.naturalWidth||pw,ih=img.naturalHeight||ph;var sw=iw*scale,sh=ih*scale;var maxX=Math.max(0,(sw-pw)/2);var maxY=Math.max(0,(sh-ph)/2);panX=Math.max(-maxX,Math.min(maxX,panX));panY=Math.max(-maxY,Math.min(maxY,panY))}img.onload=function(){var pw=port.clientWidth,ph=port.clientHeight;var iw=img.naturalWidth,ih=img.naturalHeight;scale=Math.min(pw/iw,ph/ih,1);panX=0;panY=0;applyTransform()};if(img.complete&&img.naturalWidth){img.onload()}port.addEventListener('wheel',function(e){e.preventDefault();var delta=e.deltaY>0?0.9:1.1;var ns=Math.max(minScale,Math.min(maxScale,scale*delta));var rect=port.getBoundingClientRect();var mx=e.clientX-rect.left-rect.width/2;var my=e.clientY-rect.top-rect.height/2;panX=mx-(mx-panX)*(ns/scale);panY=my-(my-panY)*(ns/scale);scale=ns;clampPan();applyTransform()},{passive:false});port.addEventListener('mousedown',function(e){e.preventDefault();dragging=true;startX=e.clientX;startY=e.clientY;startPanX=panX;startPanY=panY;port.classList.add('grabbing')});window.addEventListener('mousemove',function(e){if(!dragging)return;panX=startPanX+(e.clientX-startX);panY=startPanY+(e.clientY-startY);clampPan();applyTransform()});window.addEventListener('mouseup',function(){dragging=false;port.classList.remove('grabbing')});port.addEventListener('touchstart',function(e){if(e.touches.length===1){dragging=true;startX=e.touches[0].clientX;startY=e.touches[0].clientY;startPanX=panX;startPanY=panY}else if(e.touches.length===2){dragging=false;var dx=e.touches[0].clientX-e.touches[1].clientX;var dy=e.touches[0].clientY-e.touches[1].clientY;lastPinchDist=Math.sqrt(dx*dx+dy*dy);lastPinchScale=scale}},{passive:false});port.addEventListener('touchmove',function(e){e.preventDefault();if(e.touches.length===1&&dragging){panX=startPanX+(e.touches[0].clientX-startX);panY=startPanY+(e.touches[0].clientY-startY);clampPan();applyTransform()}else if(e.touches.length===2){var dx=e.touches[0].clientX-e.touches[1].clientX;var dy=e.touches[0].clientY-e.touches[1].clientY;var dist=Math.sqrt(dx*dx+dy*dy);if(lastPinchDist>0){var ns=Math.max(minScale,Math.min(maxScale,lastPinchScale*(dist/lastPinchDist)));var cx=(e.touches[0].clientX+e.touches[1].clientX)/2;var cy=(e.touches[0].clientY+e.touches[1].clientY)/2;var rect=port.getBoundingClientRect();var mx=cx-rect.left-rect.width/2;var my=cy-rect.top-rect.height/2;panX=mx-(mx-panX)*(ns/scale);panY=my-(my-panY)*(ns/scale);scale=ns;clampPan();applyTransform()}}},{passive:false});port.addEventListener('touchend',function(e){if(e.touches.length<2){lastPinchDist=0;lastPinchScale=scale}if(e.touches.length===0)dragging=false});window.pvZoom=function(dir){var ns=Math.max(minScale,Math.min(maxScale,scale*(dir>0?1.3:0.77)));panX=panX*(ns/scale);panY=panY*(ns/scale);scale=ns;clampPan();applyTransform()};window.pvReset=function(){scale=1;panX=0;panY=0;applyTransform()};window.__photoCleanup=function(){window.pvZoom=null;window.pvReset=null}}

function banUser(id){if(id===DB.session)return toast('Нельзя забанить самого себя');var u=DB.users.find(function(x){return x.id===id});if(!u)return;ask('Забанить '+u.name+'? Он не сможет входить и регистрироваться.',function(){DB.bans=DB.bans||[];DB.bans.push(u);DB.users=DB.users.filter(function(x){return x.id!==id});save();render();toast('🚫 Забанен')})}

function toggleBiometric(on){var u=me();if(!u)return;if(!u.pin){toast('Сначала задайте PIN');render();return}if(on)enableBiometric();else disableBiometric()}
async function enableBiometric(){try{var u=me();if(!u||!u.pin){toast('Нет PIN');return}var challenge=new Uint8Array(32);crypto.getRandomValues(challenge);var cred=await navigator.credentials.create({publicKey:{challenge:challenge,rp:{name:'МедСмена'},user:{id:new TextEncoder().encode(String(u.id)),name:u.name,displayName:u.name},pubKeyCredParams:[{alg:-7,type:'public-key'},{alg:-257,type:'public-key'}],authenticatorSelection:{authenticatorAttachment:'platform',userVerification:'required'},timeout:60000,attestation:'none'}});if(!cred){toast('Отменено');render();return}var id=btoa(String.fromCharCode.apply(null,Array.from(new Uint8Array(cred.rawId))));localStorage.setItem('medshift_bio',JSON.stringify({userId:u.id,credentialId:id}));toast('🔓 Биометрия включена');render()}catch(e){toast('Не вышло: '+(e.message||'устройство не поддерживает'));render()}}
async function disableBiometric(){localStorage.removeItem('medshift_bio');toast('🔒 Биометрия выключена');render()}
async function biometricLogin(){try{var _bio=localStorage.getItem('medshift_bio');if(!_bio){toast('Биометрия не настроена');return}var b=JSON.parse(_bio);var u=DB.users.find(function(x){return x.id===b.userId});if(!u||isDead(u.id)){toast('Учётная запись недоступна');localStorage.removeItem('medshift_bio');render();return}var challenge=new Uint8Array(32);crypto.getRandomValues(challenge);var raw=Uint8Array.from(atob(b.credentialId),function(c){return c.charCodeAt(0)});var cred=await navigator.credentials.get({publicKey:{challenge:challenge,allowCredentials:[{id:raw,type:'public-key'}],userVerification:'required',timeout:60000}});if(!cred){toast('Отменено');return}DB.session=u.id;localStorage.setItem('medshift_my',String(u.id));localStorage.setItem('medshift_rem','1');localStorage.setItem('medshift_rem_ts',String(Date.now()));save();announceLogin(u);presBeat();go('home');toast('Вход выполнен ✅')}catch(e){toast('Не удалось — войдите по PIN')}}
function logout(){DB.session=null;localStorage.setItem('medshift_rem','0');localStorage.removeItem('medshift_rem_ts');save();go('home')}

var BOT_JOKES=['— Доктор, у меня проблемы с памятью. — «И давно это у вас?» — «И давно что?»','— Доктор, меня все игнорируют. — «Следующий!»','— Я буду жить? — «А смысл?»','Скорая помощь: мы уже едем. Даже когда вы ещё только думаете, стоит ли вызывать.','В нашей сумке есть всё, кроме запасных нервов. Они просрочились ещё в феврале.','У фельдшера три состояния: в пути, на вызове и пью чай стоя.','ЭКГ — это автобиография сердца. У нашего почерк ещё тот.','Если смена прошла тихо — значит, вы ещё не открыли чат.','Термосумка хранит растворы холодными, а нас — в боевом настроении.','Любимая фраза дефибриллятора: «Ну ещё разок, с чувством».','Срок годности — единственный дедлайн в медицине, который нельзя подвинуть.','— Алло, это скорая? — «Да, слушаем.» — «А когда приедете?» — «Мы уже приехали. Открывайте, мы с чаем».','Хорошая смена — это когда отчёт зелёный, а чай горячий.','Чат — дело хорошее. Но сумку всё равно проверять руками.','— На что жалуетесь? — «На жизнь.» — «Так, пишем: общее недомогание».'];

function fbUrl(p){return FB_CONF.databaseURL.replace(/\/$/,'')+'/'+p+'.json'}

function mergeArr(local,rem){var ids={};local.forEach(function(x){ids[x.id]=1});rem.forEach(function(x){if(!ids[x.id])local.push(x)});local.sort(function(a,b){return (a.ts||0)-(b.ts||0)});return local}
function mergeUsers(rem,loc){rem=rem.filter(function(u){return !isDead(u.id)});var ids={};rem.forEach(function(u){ids[u.id]=1});loc.forEach(function(u){if(!ids[u.id]&&!isDead(u.id))rem.push(u)});return rem}
function adoptState(rem,rrev){var lt=(DB.tomb||[]).slice(),lb=(DB.bans||[]).slice();rem.chat=mergeArr(rem.chat||[],DB.chat);rem.reports=mergeArr(rem.reports||[],DB.reports);rem.tasks=mergeArr(rem.tasks||[],DB.tasks);rem.bags=mergeArr(rem.bags||[],DB.bags);rem.cars=mergeArr(rem.cars||[],DB.cars);rem.potents=mergeArr(rem.potents||[],DB.potents);rem.kitTemplates=mergeArr(rem.kitTemplates||[],DB.kitTemplates);rem.bagTypes=mergeArr(rem.bagTypes||[],DB.bagTypes);rem.ecg=(DB.ecg&&DB.ecg.length>=(rem.ecg||[]).length)?DB.ecg:(rem.ecg||[]);rem.tomb=(rem.tomb||[]).concat(lt.filter(function(x){return (rem.tomb||[]).indexOf(x)<0}));rem.bans=mergeUsers(rem.bans||[],lb);rem.users=mergeUsers(rem.users||[],DB.users);rem.users=rem.users.filter(function(u){return rem.tomb.indexOf(u.id)<0&&!rem.bans.some(function(b){return b.id===u.id})});rem.session=DB.session;rem.sched=DB.sched;rem.settings=DB.settings;DB=rem;DB.rev=rrev;normalizeDB();try{localStorage.setItem(LS,JSON.stringify(DB))}catch(e){}applyTheme();render();toast('🔄 Синхронизировано')}

function presBeat(){if(!FB_CONF.databaseURL)return;restPut('online/'+DEV,{n:(me()||{}).name||'гость',t:Date.now()}).catch(function(){});restGet('online').then(function(o){if(!o){onlineN=null;updHead();return}var n=0,now=Date.now();var newMap={};for(var k in o){if(o[k]&&o[k].t&&now-o[k].t<70000){n++;newMap[o[k].n]=true}}onlineN=n;window.__onlineMap=newMap;updHead();try{localStorage.setItem('medshift_online_cache',JSON.stringify(o))}catch(e){}if(tab==='set'){render()}})}

<script>
(function () {
  console.log('МедСмена: исправления загружены');

  /* =========================================
     1. CSS FIX: тёмная тема, диалоги, справочник
     ========================================= */
  var css = `
#dlg{
  background:var(--card);
  color:var(--tx);
  border-color:var(--bd);
}

#dlg h3,
#dlg h4,
#dlg label,
#dlg p,
#dlg td,
#dlg th{
  color:var(--tx);
}

#dlg small{
  color:var(--mut);
}

#dlg input,
#dlg select,
#dlg textarea{
  background:var(--card);
  color:var(--tx);
  border-color:var(--bd);
}

#dlg option{
  background:var(--card);
  color:var(--tx);
}

.refRx{
  background:var(--bg);
  color:var(--tx);
  border-left:3px solid var(--ac);
}

.refAnalogs{
  color:var(--mut);
}

.refAnalogs span{
  background:var(--bg);
  color:var(--tx);
  border:1px solid var(--bd);
}

.drugResults{
  background:var(--card);
  color:var(--tx);
}

.drugItem{
  color:var(--tx);
}

.reportDetail,
.reportDetail p{
  color:var(--tx);
}

.reportDetail b{
  color:var(--ac);
}

.reportDetail .rdDefect{
  color:#c62828;
}

body.dark .reportDetail .rdDefect{
  color:#ff8a80;
}

body.dark .refRx{
  background:#0f1318;
  color:#e8e8e8;
}

body.dark .refAnalogs span{
  background:#1a2129;
  color:#e8e8e8;
}
`;

  var styleEl = document.createElement('style');
  styleEl.textContent = css;
  document.head.appendChild(styleEl);

  function fixText(s) {
    return String(s)
      .split('НД/НС').join('НС/ЛС')
      .split('наркотических средств и психотропных веществ').join('НС/ЛС');
  }

  if (window.DB && !DB.shiftGrid) {
    DB.shiftGrid = [];
  }

  /* =========================================
     2. Замена текста в диалогах
     ========================================= */
  if (window.openDlg) {
    var _openDlg = window.openDlg;
    window.openDlg = function (h) {
      if (typeof h === 'string') h = fixText(h);
      _openDlg(h);
    };
  }

  /* =========================================
     3. Н/СЛ: создание комплекта из любого шаблона
     ========================================= */
  window.getTplById = function (id) {
    if (id === 'bag') {
      return (window.DB && DB.bagTypes && DB.bagTypes[0]) ? DB.bagTypes[0] : { name: 'Шаблон сумки', items: [] };
    }

    var ki = parseInt(String(id).replace('kit_', ''), 10);
    return (window.DB && DB.kitTemplates && DB.kitTemplates[ki]) ? DB.kitTemplates[ki] : { name: 'Шаблон', items: [] };
  };

  window.createPotentBagFromTpl = function (tplId) {
    var tpl = window.getTplById ? getTplById(tplId) : null;

    if (!tpl || !(tpl.items || []).length) {
      return toast('Шаблон пуст или не найден');
    }

    askText('Название комплекта НС/ЛС', '⚕ НС/ЛС', function (n) {
      if (!n.trim()) return;

      DB.potents = DB.potents || [];

      DB.potents.push({
        id: uid(),
        name: n.trim(),
        items: tpl.items.filter(function (i) {
          return i.name && i.name !== 'Новая позиция';
        }).map(function (i) {
          return {
            name: i.name,
            spec: i.spec || '',
            unit: i.unit || 'шт',
            qty: i.qty || 1,
            expiry: '',
            potent: true
          };
        })
      });

      save();

      curPot = true;
      curTpl = false;
      curPotKit = DB.potents[DB.potents.length - 1].id;

      render();
      toast('Комплект НС/ЛС создан');
    });
  };

  window.createPotentBag = function () {
    if (window.openTplId) {
      return createPotentBagFromTpl(openTplId);
    }

    var kt = (DB.kitTemplates || []).find(function (k) {
      return k.name.indexOf('Сильнодействующие') >= 0 || k.name.indexOf('НС/ЛС') >= 0;
    });

    if (!kt) {
      curPot = false;
      curTpl = true;
      render();
      return toast('Откройте шаблон и нажмите «Создать комплект НС/ЛС из этого шаблона»');
    }

    var ki = (DB.kitTemplates || []).indexOf(kt);
    createPotentBagFromTpl('kit_' + ki);
  };

  if (window.tplView) {
    var _tplView = window.tplView;
    window.tplView = function () {
      var h = _tplView();
      h = h.replace(/<p style="margin-top:6px"><button class="btn mini" onclick="createPotentBag\(\)">[\s\S]*?<\/button><\/p>/g, '');
      return fixText(h);
    };
  }

  function injectTplPotentButtons() {
    if (!window.curTpl || !window.openTplId) return;
    if (!window.me || !me()) return;

    var body = document.getElementById('tpl_' + openTplId);
    if (!body || !body.classList.contains('open')) return;
    if (body.querySelector('.ms-potent-create')) return;

    var p = document.createElement('p');
    p.style.marginTop = '6px';

    var btn = document.createElement('button');
    btn.className = 'btn mini ms-potent-create';
    btn.textContent = '📦 Создать комплект НС/ЛС из этого шаблона';

    btn.onclick = function () {
      createPotentBagFromTpl(openTplId);
    };

    p.appendChild(btn);
    body.appendChild(p);
  }

  /* =========================================
     4. Отчёты: статусы, печать, скачивание
     ========================================= */
  window.expiredItemText = function (d) {
    if (typeof d === 'string') return d;

    if (d && d.item) {
      var place = d.type === 'kit'
        ? ((d.carName || '') + ' / ' + (d.kitName || ''))
        : (d.name || '');

      return place + ': ' + (d.item.name || '') + ' (' + (d.item.expiry || 'нет срока') + ')';
    }

    return 'неизвестная позиция';
  };

  window.reportStatus = function (r) {
    if (!r) return { cls: 'bY', label: '—' };

    if (r.resolved) {
      return { cls: 'bG', label: '✅ исправлен' };
    }

    if (r.status === 'green') {
      return { cls: 'bG', label: 'без замечаний' };
    }

    if (r.status === 'yellow') {
      return { cls: 'bY', label: 'с замечаниями' };
    }

    return { cls: 'bR', label: 'КРАСНЫЙ' };
  };

  window.reportBadge = function (r) {
    var s = reportStatus(r);
    return '<span class="badge ' + s.cls + '">' + s.label + '</span>';
  };

  window.reportsView = function () {
    var h = '<h3>📨 Отчёты</h3>';
    h += '<p style="font-size:calc(var(--fs) - 2px);color:var(--mut)">Просмотр доступен всем. Удалять и менять статус может только руководитель или админ.</p>';

    var reps = (DB.reports || []).slice().reverse();

    if (!reps.length) {
      return h + '<p>Отчётов пока нет</p>';
    }

    h += '<table>';

    reps.forEach(function (r) {
      h += '<tr>';
      h += '<td>' + reportBadge(r) + ' <b>' + esc(r.car || '') + '</b> · ' + esc(r.user || '') + '<br>';
      h += '<small>' + new Date(r.ts).toLocaleString('ru-RU', { day: '2-digit', month: '2-digit', hour: '2-digit', minute: '2-digit' });

      if (r.remarks) {
        h += ' · ' + esc(r.remarks);
      }

      if (r.potentBag) {
        h += ' · ⚕ ' + esc(r.potentBag);
      }

      h += '</small></td>';

      h += '<td style="width:1%;white-space:nowrap">';
      h += '<button class="btn sec mini" onclick="viewReport(' + r.id + ')">👁</button>';

      if (isBoss()) {
        h += ' <button class="btn del" onclick="delReport(' + r.id + ')">🗑</button>';
      }

      h += '</td></tr>';
    });

    h += '</table>';

    return h;
  };

  window.resolveReport = function (id) {
    if (!isBoss()) return;

    var r = DB.reports.find(function (x) { return x.id === id; });
    if (!r) return;

    r.resolved = true;
    r.viewed = true;
    r.resolvedBy = (me() || {}).name || '';
    r.resolvedTs = Date.now();

    save();
    closeDlg();
    render();

    toast('Отчёт отмечен как исправленный');
  };

  window.unresolveReport = function (id) {
    if (!isBoss()) return;

    var r = DB.reports.find(function (x) { return x.id === id; });
    if (!r) return;

    r.resolved = false;
    delete r.resolvedBy;
    delete r.resolvedTs;

    save();
    closeDlg();
    render();

    toast('Отчёт возвращён в работу');
  };

  window.reportText = function (r) {
    var s = reportStatus(r);
    var L = [];

    L.push('ОТЧЁТ ПО СМЕНЕ');
    L.push('');
    L.push('Статус: ' + s.label);
    L.push('Дата: ' + new Date(r.ts).toLocaleString('ru-RU'));
    L.push('Машина: ' + (r.car || ''));
    L.push('Сотрудник: ' + (r.user || ''));
    L.push('Бригада: ' + (r.brigade || '—'));
    L.push('Рабочая сумка: ' + (r.bagNum || '—'));
    L.push('ЭКГ №: ' + (r.ecgNum || '—') + ' · заряд: ' + (r.ecgCharge || '—'));

    if (r.potentBag) {
      L.push('Комплекты НС/ЛС: ' + r.potentBag);
    }

    if (r.defects && r.defects.length) {
      L.push('');
      L.push('Дефекты оборудования:');
      r.defects.forEach(function (d) {
        L.push('- ' + d);
      });
    }

    if (r.expired && r.expired.length) {
      L.push('');
      L.push('Просроченные / истекающие позиции:');
      r.expired.forEach(function (d) {
        L.push('- ' + expiredItemText(d));
      });
    }

    if (r.remarks) {
      L.push('');
      L.push('Примечания:');
      L.push(r.remarks);
    }

    if (r.resolved) {
      L.push('');
      L.push('Отчёт отмечен как исправленный:');
      L.push(new Date(r.resolvedTs).toLocaleString('ru-RU') + ' · ' + (r.resolvedBy || ''));
    }

    return L.join('\n');
  };

  window.downloadReport = function (id) {
    var r = DB.reports.find(function (x) { return x.id === id; });
    if (!r) return;

    var text = reportText(r);
    var blob = new Blob([text], { type: 'text/plain;charset=utf-8' });
    var a = document.createElement('a');

    a.href = URL.createObjectURL(blob);
    a.download = 'otchet-' + String(r.car || '').replace(/\s+/g, '_') + '-' + new Date(r.ts).toISOString().slice(0, 10) + '.txt';
    a.click();

    toast('Отчёт сохранён в файл');
  };

  window.reportPrintHtml = function (r) {
    var s = reportStatus(r);

    var h = '';
    h += '<h1>Отчёт по смене</h1>';
    h += '<p><b>Статус:</b> ' + s.label + '</p>';
    h += '<p><b>Дата:</b> ' + new Date(r.ts).toLocaleString('ru-RU') + '</p>';
    h += '<p><b>Машина:</b> ' + esc(r.car || '') + '</p>';
    h += '<p><b>Сотрудник:</b> ' + esc(r.user || '') + '</p>';
    h += '<p><b>Бригада:</b> ' + esc(r.brigade || '—') + '</p>';
    h += '<p><b>Рабочая сумка:</b> ' + esc(r.bagNum || '—') + '</p>';
    h += '<p><b>ЭКГ №:</b> ' + esc(r.ecgNum || '—') + ' · заряд: ' + esc(r.ecgCharge || '—') + '</p>';

    if (r.potentBag) {
      h += '<p><b>Комплекты НС/ЛС:</b> ' + esc(r.potentBag) + '</p>';
    }

    if (r.defects && r.defects.length) {
      h += '<div class="section"><b>Дефекты оборудования:</b><ul>';
      r.defects.forEach(function (d) {
        h += '<li>' + esc(d) + '</li>';
      });
      h += '</ul></div>';
    }

    if (r.expired && r.expired.length) {
      h += '<div class="section"><b>Просроченные / истекающие позиции:</b><ul>';
      r.expired.forEach(function (d) {
        h += '<li>' + esc(expiredItemText(d)) + '</li>';
      });
      h += '</ul></div>';
    }

    if (r.remarks) {
      h += '<div class="section"><b>Примечания:</b><p>' + esc(r.remarks) + '</p></div>';
    }

    if (r.resolved) {
      h += '<div class="section"><b>Отчёт отмечен как исправленный:</b><p>' + new Date(r.resolvedTs).toLocaleString('ru-RU') + ' · ' + esc(r.resolvedBy || '') + '</p></div>';
    }

    return h;
  };

  window.printReport = function (id) {
    var r = DB.reports.find(function (x) { return x.id === id; });
    if (!r) return;

    var w = window.open('', '_blank');

    if (!w) {
      return toast('Браузер заблокировал окно печати');
    }

    var html = '';
    html += '<html lang="ru"><head><meta charset="utf-8">';
    html += '<title>Отчёт по смене</title>';
    html += '<style>';
    html += 'body{font-family:system-ui,Arial,sans-serif;padding:16px;color:#111}';
    html += 'h1{font-size:22px;margin:0 0 12px}';
    html += 'p{margin:6px 0}';
    html += '.section{margin-top:14px;padding-top:10px;border-top:1px solid #ccc}';
    html += 'ul{margin:6px 0;padding-left:20px}';
    html += 'li{margin:3px 0}';
    html += '</style>';
    html += '</head><body>';
    html += reportPrintHtml(r);
    html += '</body></html>';

    w.document.write(html);
    w.document.close();

    setTimeout(function () {
      w.print();
    }, 300);
  };

  /* =========================================
     5. Новый submitRep: НС/ЛС + нормальные сроки
     ========================================= */
  if (window.submitRep) {
    window.submitRep = function (mode) {
      if (mode === 'rem' && !document.getElementById('rpRem').value.trim()) {
        return toast('Опишите замечания');
      }

      var c = DB.cars.find(function (x) { return x.id === repCar; });
      var u = me();

      var expList = soonList();

      var hasExpired = expList.some(function (x) {
        return x.item && x.item.expiry && daysLeft(x.item.expiry) < 0;
      });

      var exp = expList.map(function (x) {
        var place = x.type === 'kit'
          ? ((x.carName || '') + ' / ' + (x.kitName || ''))
          : (x.name || '');

        var itemName = x.item && x.item.name ? x.item.name : 'позиция';
        var itemExp = x.item && x.item.expiry ? x.item.expiry : 'нет срока';

        return place + ': ' + itemName + ' (' + itemExp + ')';
      });

      var defs = [];
      var equip = [];

      (c.equip || []).forEach(function (e) {
        var st = (document.getElementById('re_' + e.id) || {}).value || 'ok';
        var df = (document.getElementById('rd_' + e.id) || {}).value || '';

        e.status = st;
        e.defect = df;

        if (st !== 'ok') {
          defs.push(e.name + (df ? ' (' + df + ')' : ''));
        }

        equip.push({
          ovm: e.ovm,
          name: e.name,
          status: st,
          charge: e.charge,
          defect: df
        });
      });

      var body = document.getElementById('dlgBody') || window.dlgBody;
      var pboxes = body ? body.querySelectorAll('input[data-pot]:checked') : [];
      var pbSel = [];

      for (var pi = 0; pi < pboxes.length; pi++) {
        pbSel.push(+pboxes[pi].getAttribute('data-pot'));
      }

      var potBag = (DB.potents || [])
        .filter(function (k) {
          return pbSel.indexOf(k.id) >= 0;
        })
        .map(function (k) {
          return k.name;
        })
        .join(', ');

      var st = hasExpired
        ? 'red'
        : ((expList.length > 0 || mode === 'rem' || defs.length > 0) ? 'yellow' : 'green');

      DB.reports.push({
        id: uid(),
        ts: Date.now(),
        kind: 'shift',
        carId: c.id,
        car: c.name,
        userId: u.id,
        user: u.name,
        brigade: document.getElementById('rpBrig').value.trim(),
        bagNum: document.getElementById('rpBag').value,
        ecgNum: document.getElementById('rpEcg').value,
        ecgCharge: document.getElementById('rpEcgCh').value.trim(),

  // ---------- разбор строк импортируемого файла ----------
  function parseTplLines(text) {
    var items = [];
    String(text).split(/\r?\n/).forEach(function (line) {
      line = line.trim();
      if (!line) return;
      line = line.replace(/^\s*\d{1,3}\s*[.)]\s*/, '');
      var qty = 1, unit = 'шт';
      var m = line.match(/^(.*?)\s+([0-9]{1,4})\s*(амп|фл|шт|пар|уп|таб|капс|компл|блистер|пакет)?\.?$/i);
      if (m) {
        line = m[1];
        qty = +m[2];
        if (m[3]) unit = m[3].toLowerCase();
      }
      if (!line) return;
      items.push({ name: line, spec: '', unit: unit, qty: qty, expiry: '', potent: false });
    });
    return items;

   Синхронизация работает, посторонние снаружи.
   ========================================= */
(function () {
  if (window.__fix8_applied) return;
  window.__fix8_applied = true;

  var LS_AUTH = 'medshift_fb_auth';
  var API_KEY = (window.FB_CONF && FB_CONF.apiKey) || '';

  function loadAuth() {
    try { return JSON.parse(localStorage.getItem(LS_AUTH) || 'null'); } catch (e) { return null; }
  }
  function saveAuth(a) {
    if (a) localStorage.setItem(LS_AUTH, JSON.stringify(a));
    else localStorage.removeItem(LS_AUTH);
  }

  function scheduleRefresh(a) {
    if (!a || !a.exp) return;
    var delay = Math.max(30000, (a.exp - Date.now()) - 5 * 60000);
    setTimeout(function () { refreshToken(a.rt); }, delay);
  }

  function refreshToken(rt) {
    if (!rt || !API_KEY) return;
    fetch('https://securetoken.googleapis.com/v1/token?key=' + API_KEY, {
      method: 'POST',
      headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
      body: 'grant_type=refresh_token&refresh_token=' + encodeURIComponent(rt)
    }).then(function (r) { return r.json(); }).then(function (j) {
      if (j && j.id_token) {
        var a = loadAuth() || {};
        a.rt = j.refresh_token || a.rt;
        a.id = j.id_token;
        a.exp = Date.now() + (+j.expires_in || 3600) * 1000;
        saveAuth(a);
        window.__fbToken = j.id_token;
        scheduleRefresh(a);
      } else {
        window.__fbToken = null;
      }
    }).catch(function () { window.__fbToken = null; });
  }

  function signIn(email, pass, cbOk, cbErr) {
    fetch('https://identitytoolkit.googleapis.com/v1/accounts:signInWithPassword?key=' + API_KEY, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ email: email, password: pass, returnSecureToken: true })
    }).then(function (r) { return r.json(); }).then(function (j) {
      if (j && j.idToken) {
        var a = {
          email: email,
          rt: j.refreshToken,
          id: j.idToken,
          exp: Date.now() + (+j.expiresIn || 3600) * 1000
        };
        saveAuth(a);
        window.__fbToken = j.idToken;
        scheduleRefresh(a);
        cbOk();
      } else {
        cbErr((j && j.error && j.error.message) || 'UNKNOWN');
      }
    }).catch(function () { cbErr('NETWORK'); });
  }

  function errText(m) {
    if (!m) return 'Неизвестная ошибка';
    if (m.indexOf('INVALID_PASSWORD') >= 0 || m.indexOf('INVALID_LOGIN_CREDENTIALS') >= 0) return 'Неверный email или пароль склада';
    if (m.indexOf('USER_NOT_FOUND') >= 0) return 'Пользователь не создан в консоли Firebase';
    if (m.indexOf('TOO_MANY_ATTEMPTS') >= 0) return 'Слишком много попыток — подождите минуту';
    if (m === 'NETWORK') return 'Нет связи с сервером';
    return m;
  }

  window.fbCredDlg = function () {
    var a = loadAuth();
    openDlg(
      '<h3>🔑 Ключ склада</h3>' +
      '<p style="font-size:calc(var(--fs) - 2px);color:var(--mut)">Один раз на устройство: email и пароль склада, которые создал руководитель в консоли Firebase.</p>' +
      '<label>Email склада</label><input id="fbEmail" type="email" value="' + esc((a && a.email) || '') + '">' +

(function () {

  function restDelete(p) {

  }

  function bumpSchedMeta() {
    restPut('schedmeta', { ts: Date.now() }).then(function () {
      window.__schedSeen = Date.now();
    });
  }

  function alive(kind, p, now) {
    if (!p || !p.ts) return false;
    if (kind === 'days') return now - p.ts < 2 * 864e5;
    var q = (p.month || '').split('-');
    if (!q[0] || !q[1]) return false;
    return now < new Date(+q[0], +q[1], 3).getTime();
  }

  /* добавление фото: сразу на склад */
  if (window.addSchedPhoto) {

          DB.sched[kind].push(p);
          save();
          render();
          toast('Фото добавлено');
          if (window.__fbToken) {
            restPut('sched/' + kind + '/' + p.id, p).then(function () { bumpSchedMeta(); });
          }
        } catch (e) {

      });

  /* удаление фото: и со склада тоже */

      if (window.__fbToken) {
        restDelete('sched/' + kind + '/' + id).then(function () { bumpSchedMeta(); });
      }
    };
  }

  /* сверка со складом: скачать чужие, залить свои, убрать протухшее */
  function schedSync() {
    if (!window.FB_CONF || !FB_CONF.databaseURL || !window.__fbToken) return;
    restGet('schedmeta').then(function (m) {
      var ts = (m && m.ts) || 0;
      if (window.__schedSeenOnce && ts === window.__schedSeen) return;

          llist.forEach(function (p) {

/* =========================================
   ДОПОЛНЕНИЕ 27: ПОГОДА БЕЗ ЦИКЛОВ И СПАМА
   Поведение оригинала (город из настроек, кэш s.geo 30 мин,
   обновление #cwWeather), добавлены таймаут (AbortController),
   тихие ошибки и кулдаун повторов.
   Без render() и без DB.weather — циклов нет.
   ========================================= */
(function () {
  if (window.__fix27_applied) return;
  window.__fix27_applied = true;

  var _loadWeather = window.loadWeather;
  if (typeof _loadWeather !== 'function') return;

  window.loadWeather = function () {
    var el = document.getElementById('cwWeather');
    if (!el) return;
    var s = (window.S && window.S()) || {};
    var city = (s.city || '').trim();
    var now = Date.now();

    if (!city) { el.innerHTML = '<span class="cwDesc">город не задан</span>'; return; }

    // Кэш 30 минут (как в оригинале) — повторные render() не перезапрашивают
    var g = s.geo;
    if (g && g.city === city && now - g.ts < 18e5) {
      el.innerHTML = '<span class="cwTemp">' + wIcon(g.code) + ' ' + g.temp + '°C</span><br><span class="cwDesc">' + esc(city) + '</span>';
      return;
    }

    // Кулдаун повторов: при обрыве сети каждый render() = новый запрос.
    // Пробуем снова не чаще раза в 30 секунд.
    if (now - (window.__weatherTryTs || 0) < 30000) return;
    window.__weatherTryTs = now;

    el.innerHTML = '<span class="cwDesc">…</span>';

    var ctl = new AbortController();
    var to = setTimeout(function () { ctl.abort(); }, 7000);
    function done() { clearTimeout(to); }

    fetch('https://geocoding-api.open-meteo.com/v1/search?name=' + encodeURIComponent(city) + '&count=1&language=ru', { signal: ctl.signal })
      .then(function (r) { if (!r.ok) throw 0; return r.json(); })
      .then(function (j) {
        if (!j.results || !j.results[0]) throw 0;
        var c = j.results[0];
        return fetch('https://api.open-meteo.com/v1/forecast?latitude=' + c.latitude + '&longitude=' + c.longitude + '&current=temperature_2m,weather_code', { signal: ctl.signal })
          .then(function (r) { if (!r.ok) throw 0; return r.json(); })
          .then(function (w) {
            if (!w.current) throw 0;
            var t = Math.round(w.current.temperature_2m);
            var code = w.current.weather_code;
            s.geo = { city: city, ts: Date.now(), temp: t, code: code };
            if (window.save) save(); // кэш погоды в настройках, как в оригинале
            done();
            el.innerHTML = '<span class="cwTemp">' + wIcon(code) + ' ' + t + '°C</span><br><span class="cwDesc">' + esc(city) + '</span>';
          });
      })
      .catch(function () {
        done();
        el.innerHTML = '<span class="cwDesc">нет связи</span>';
      });
  };

  console.log('[Fix27] ✅ Погода: без циклов, с таймаутом и кулдауном');
})();

           'radial-gradient(2px 2px at 85% 55%,#cfd8ff 50%,transparent 51%),' +
           'radial-gradient(1.5px 1.5px at 10% 80%,#fff 50%,transparent 51%),' +
           'linear-gradient(180deg,#0a1030 0%,#141b3f 55%,#1c2340 100%)'
    },
med: {
name: 'Закат 🌇', txt: '#fff',
css: 'linear-gradient(180deg,#233a63 0%,#5d4a7e 26%,#9c6288 48%,#d98274 70%,#f2b06b 88%,#f9d38a 100%)'
},
  };

  /* слой фона */
  var st = document.createElement('style');
  st.textContent =
    '#msBg{position:fixed;left:0;top:0;right:0;bottom:0;z-index:-1;pointer-events:none;' +
    'background-size:cover;background-position:center}' +
    'body.dark #msBg{filter:brightness(.55) saturate(.85)}';
  document.head.appendChild(st);
  var layer = document.createElement('div');
  layer.id = 'msBg';
  document.body.appendChild(layer);

  function applyBg34() {
    var s = S(); var t = s.bg || ''; var bi = 'none';
    if (t === 'custom') {
      var img = localStorage.getItem(LS_BG);
      if (img) bi = 'linear-gradient(rgba(244,246,248,.28),rgba(244,246,248,.42)), url("' + img + '")';
      else t = '';
    } else if (PRESETS[t]) bi = PRESETS[t].css;
    layer.style.backgroundImage = bi;
  }
  window.applyBg34 = applyBg34;

  window.setBg34 = function (key) {
    S().bg = key; save(); applyBg34(); render();
    toast(key === '' ? 'Фон убран' : '🖼 Фон: ' + (PRESETS[key] ? PRESETS[key].name : 'свой'));
  };

  function compressBg(f, cb) {
    var r = new FileReader();
    r.onload = function () {
      var im = new Image();
      im.onload = function () {
        var max = 1000, w = im.width, h = im.height;
        if (w > max || h > max) { var k = Math.min(max / w, max / h); w = Math.round(w * k); h = Math.round(h * k); }
        var cv = document.createElement('canvas');
        cv.width = w; cv.height = h;
        cv.getContext('2d').drawImage(im, 0, 0, w, h);
        cb(cv.toDataURL('image/jpeg', 0.6));
      };
      im.onerror = function () { cb(null); };
      im.src = r.result;
    };
    r.readAsDataURL(f);
  }

  window.setBgCustom34 = function (inp) {
    var f = inp.files && inp.files[0];
    inp.value = '';
    if (!f) return;
    compressBg(f, function (data) {
      if (!data) return toast('Не удалось прочитать картинку');
      if (data.length > 900000) return toast('Картинка слишком тяжёлая — возьми поменьше');
      localStorage.setItem(LS_BG, data);
      S().bg = 'custom'; save(); applyBg34(); render();
      toast('📷 Свой фон установлен');
    });
  };

  /* карточка выбора фона в «Ещё» */
  function bgCard() {
    var s = S(); var cur = s.bg || '';
    var h = '<div class="card"><h3>🖼 Фон приложения</h3>';
    h += '<p style="font-size:calc(var(--fs) - 2px);color:var(--mut)">Настройка личная для этого устройства: выбери готовый фон или загрузи свою картинку.</p>';
    h += '<div style="display:flex;gap:6px;flex-wrap:wrap;align-items:center">';
    h += '<button class="btn sec mini" style="' + (cur === '' ? 'border-width:2px;' : '') + '" onclick="setBg34(\'\')">✕ Без фона</button>';
    for (var k in PRESETS) {
      h += '<button class="btn mini" style="background:' + PRESETS[k].css.split('"').join('&quot;') + ';color:' + PRESETS[k].txt + ';' +
           (cur === k ? 'outline:2px solid var(--ac);' : '') + '" onclick="setBg34(\'' + k + '\')">' + PRESETS[k].name + '</button>';
    }
    h += '<label class="btn sec mini" style="display:inline-block;margin:3px 3px 3px 0">📷 Своя картинка<input type="file" hidden accept="image/*" onchange="setBgCustom34(this)"></label>';
    if (cur === 'custom' && localStorage.getItem(LS_BG)) {
      h += '<img src="' + localStorage.getItem(LS_BG) + '" style="width:40px;height:28px;object-fit:cover;border-radius:4px;border:1px solid var(--bd)">';
    }
    h += '</div></div>';
    return h;
  }

  if (window.setView) {
    var _sv34 = window.setView;
    window.setView = function () {
      var h = _sv34();
      return h.replace('<div class="card"><h3>Данные</h3>', bgCard() + '<div class="card"><h3>Данные</h3>');
    };
  }

  applyBg34();
  console.log('[Fix34] ✅ Фоны: 3 готовых + своя картинка');
})();
/* =========================================
   ДОПОЛНЕНИЕ 35: УДАЛЕНИЕ ФОТО НАВСЕГДА
   Могилка schedTomb + перехват заливки/скачивания.
   ========================================= */
(function () {
  if (window.__fix35_applied) return;
  window.__fix35_applied = true;

  var CUT = 40 * 864e5; /* могилка живёт 40 дней */

  function tomb() { DB.schedTomb = DB.schedTomb || {}; return DB.schedTomb; }
  function pruneTomb() {
    var t = tomb(), now = Date.now();
    Object.keys(t).forEach(function (id) { if (now - (+t[id] || 0) > CUT) delete t[id]; });
  }
  function purgeLocal() {
    if (!window.DB || !DB.sched) return false;
    var t = tomb(), ch = false;
    ['days', 'months'].forEach(function (k) {
      var arr = DB.sched[k] || [];
      var f = arr.filter(function (p) { return !t[p.id]; });
      if (f.length !== arr.length) { DB.sched[k] = f; ch = true; }
    });
    return ch;
  }
  function mergeTomb(tb) {
    tb = tb || {};
    var t = tomb();
    Object.keys(tb).forEach(function (id) {
      var ts = (tb[id] && tb[id].ts) ? +tb[id].ts : +tb[id];
      if (ts && (!t[id] || ts > t[id])) t[id] = ts;
    });
    pruneTomb();
  }
  function del35(p) { return fetch(fbUrl(p), { method: 'DELETE' }).catch(function () {}); }

  /* скачивание: удалённые фото никому не отдаются */
  var _rg35 = window.restGet;
  window.restGet = function (p) {
    if (p === 'sched') {
      return _rg35('schedtomb').then(function (tb) {
        mergeTomb(tb);
        purgeLocal();
        return _rg35('sched').then(function (rem) {
          rem = rem || {};
          var t = tomb();
          ['days', 'months'].forEach(function (k) {
            var obj = rem[k] || {};
            Object.keys(obj).forEach(function (id) { if (t[id]) delete obj[id]; });
            rem[k] = obj;
          });
          return rem;
        });
      });
    }
    return _rg35(p);
  };

  /* заливка: удалённые фото не возвращаются на сервер */
  var _rp35 = window.restPut;
  window.restPut = function (p, o) {
    var m = /^sched\/(days|months)\/(.+)$/.exec(p || '');
    if (m && tomb()[m[2]]) return Promise.resolve(null);
    return _rp35(p, o);
  };

  /* save/render всегда с чисткой */
  var _sv35 = window.save;
  window.save = function () { purgeLocal(); return _sv35.apply(this, arguments); };
  var _rd35 = window.render;
  window.render = function () { purgeLocal(); return _rd35.apply(this, arguments); };

  /* синхронизация баз: объединяем могилки */
  if (window.adoptState) {
    var _ad35 = window.adoptState;
    window.adoptState = function (rem, rrev) {
      var lt = DB.schedTomb || {};
      rem.schedTomb = rem.schedTomb || {};
      Object.keys(lt).forEach(function (id) {
        if (!rem.schedTomb[id] || (+lt[id] || 0) > (+rem.schedTomb[id] || 0)) rem.schedTomb[id] = lt[id];
      });
      _ad35(rem, rrev);
      purgeLocal();
    };
  }

  /* удаление: ставим метку локально и на сервере */
  if (window.delPhoto) {
    var _dp35 = window.delPhoto;
    window.delPhoto = function (kind, id) {
      tomb()[id] = Date.now();
      pruneTomb();
      _dp35(kind, id);
      if (window.__fbToken) {
        _rp35('schedtomb/' + id, { ts: Date.now() }).then(function () {
          return _rp35('schedmeta', { ts: Date.now() });
        });
      }
    };
  }

  /* уборка: доудаляем с сервера забытые удалённые фото и досылаем могилки */
  function serverCleanup() {
    if (!window.FB_CONF || !FB_CONF.databaseURL || !window.__fbToken) return;
    _rg35('schedtomb').then(function (tb) {
      tb = tb || {};
      var missing = Object.keys(tomb()).filter(function (id) { return !tb[id]; });
      mergeTomb(tb);
      if (purgeLocal()) { _sv35(); _rd35(); }
      var p = missing.length
        ? Promise.all(missing.map(function (id) { return _rp35('schedtomb/' + id, { ts: tomb()[id] }); }))
            .then(function () { return _rp35('schedmeta', { ts: Date.now() }); })
        : Promise.resolve();
      return p.then(function () { return _rg35('sched'); }).then(function (rem) {
        rem = rem || {};
        var t = tomb(), dels = [];
        ['days', 'months'].forEach(function (k) {
          Object.keys(rem[k] || {}).forEach(function (id) { if (t[id]) dels.push('sched/' + k + '/' + id); });
        });
        if (!dels.length) return;
        return Promise.all(dels.map(del35)).then(function () {
          return _rp35('schedmeta', { ts: Date.now() });
        });
      });
    }).catch(function () {});
  }
  setTimeout(serverCleanup, 4000);
  setInterval(serverCleanup, 25000);
  document.addEventListener('visibilitychange', function () { if (!document.hidden) serverCleanup(); });

  console.log('[Fix35] ✅ Удаление фото навсегда (могилка schedTomb)');
})();
/* =========================================
ДОПОЛНЕНИЕ 36: Справочник — живой поиск
без потери фокуса (обновляется только список)
========================================= */
(function () {
  if (window.__fix36_applied) return;
  window.__fix36_applied = true;

  window.renderRefResults = function () {
    var box = document.getElementById('refResults');
    if (!box) return;
    var q = (refSearch || '').trim().toLowerCase();
    var filtered = [];
    if (q.length >= 1) {
      filtered = DRUG_DB.filter(function (d) {
        return d.n.toLowerCase().indexOf(q) >= 0 ||
          (d.s || '').toLowerCase().indexOf(q) >= 0 ||
          (d.g || '').toLowerCase().indexOf(q) >= 0 ||
          (d.a || []).some(function (a) { return a.toLowerCase().indexOf(q) >= 0; });
      });
    }
    var h = '';
    if (!filtered.length) {
      h = '<div class="refCard"><h4>💊 Справочник РЛС</h4><p style="font-size:calc(var(--fs) - 1px);color:var(--mut)">Ничего не найдено на «' + esc(refSearch) + '». В базе ' + DRUG_DB.length + ' препаратов.</p></div>';
    } else {
      if (q) h += '<p style="font-size:calc(var(--fs) - 2px);color:var(--mut)">Найдено: ' + filtered.length + ' из ' + DRUG_DB.length + '</p>';
      var shown = filtered.slice(0, 60);
      shown.forEach(function (d) {
        var gi = DRUG_DB.indexOf(d);
        h += '<div class="refCard" onclick="refDrugDlg(' + gi + ')"><h4>' + (d.g && d.g.indexOf('⚕') >= 0 ? '⚕ ' : '') + esc(d.n) + '</h4>';
        h += '<div class="refRow"><span class="refLabel">Дозировка:</span><span class="refVal">' + esc(d.s) + '</span></div>';
        h += '<div class="refRow"><span class="refLabel">Форма:</span><span class="refVal">' + esc(d.u) + '</span></div>';
        if (d.g) h += '<div class="refRow"><span class="refLabel">Группа:</span><span class="refVal">' + esc(d.g) + '</span></div>';
        if (d.a && d.a.length) h += '<div class="refAnalogs"><span class="refLabel">Аналоги:</span> ' + d.a.map(function (a) { return '<span>' + esc(a) + '</span>'; }).join('') + '</div>';
        h += '<p style="margin:6px 0 0;color:var(--ac)">👁 Подробнее…</p></div>';
      });
      if (filtered.length > shown.length) h += '<p style="color:var(--mut);font-size:calc(var(--fs) - 2px);text-align:center">…и ещё ' + (filtered.length - shown.length) + '. Уточните запрос.</p>';
    }
    box.innerHTML = h;
  };

  window.refView = function () {
    var h = '<h3>💊 Справочник лекарственных средств</h3>';
    h += '<div class="refSearch"><input type="text" id="refInput" placeholder="🔍 Поиск препарата (название, группа, аналог)…" value="' + esc(refSearch) + '" oninput="refSearch=this.value;renderRefResults()" autofocus>';
    h += '<button class="searchClear" onclick="refSearch=\'\';var i=document.getElementById(\'refInput\');if(i)i.value=\'\';renderRefResults()">✕</button></div>';
    h += '<div id="refResults"></div>';
    setTimeout(window.renderRefResults, 0);
    return h;
  };

  console.log('[Fix36] ✅ Справочник: живой поиск без потери фокуса');
})();
/* =========================================
ДОПОЛНЕНИЕ 37: Могилки сумок и комплектов
— чтобы удалённые не воскресали
========================================= */
(function(){
if(window.__fix37) return;
window.__fix37 = true;
DB.bagTomb = DB.bagTomb || [];
DB.potTomb = DB.potTomb || [];
var _db = window.delBag;
window.delBag = function(id){
if(DB.bagTomb.indexOf(id)<0) DB.bagTomb.push(id);
save(); _db(id);
};
var _dp = window.delPotKit;
window.delPotKit = function(id){
if(DB.potTomb.indexOf(id)<0) DB.potTomb.push(id);
save(); _dp(id);
};
var _ad = window.adoptState;
window.adoptState = function(rem,rrev){
rem.bagTomb = (rem.bagTomb||[]).concat(DB.bagTomb.filter(function(x){return (rem.bagTomb||[]).indexOf(x)<0}));
rem.potTomb = (rem.potTomb||[]).concat(DB.potTomb.filter(function(x){return (rem.potTomb||[]).indexOf(x)<0}));
rem.bags = (rem.bags||[]).filter(function(b){return rem.bagTomb.indexOf(b.id)<0});
rem.potents = (rem.potents||[]).filter(function(p){return rem.potTomb.indexOf(p.id)<0});
_ad(rem,rrev);
DB.bags = (DB.bags||[]).filter(function(b){return (DB.bagTomb||[]).indexOf(b.id)<0});
DB.potents = (DB.potents||[]).filter(function(p){return (DB.potTomb||[]).indexOf(p.id)<0});
};
console.log('[Fix37] ✅ Могилки сумок и комплектов — чтобы удалённые не воскресали');
})();
/* =========================================
ДОПОЛНЕНИЕ 38: Могилки машин
— удалённые машины не воскресают после перезагрузки
========================================= */

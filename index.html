<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover,interactive-widget=resizes-content">
<title>МедСмена</title>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#0b5394">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<style>
:root{--ac:#0b5394;--bg:#f4f6f8;--card:#fff;--tx:#111;--mut:#666;--bd:#ddd;--fs:14px;--vh:1vh;--kb:0px;--sab:env(safe-area-inset-bottom,0px)}
body.dark{--bg:#12161c;--card:#1c232c;--tx:#e8e8e8;--mut:#9aa5b1;--bd:#2a3340}
*{box-sizing:border-box}
body{font-family:system-ui;margin:0;background:var(--bg);color:var(--tx);overflow-x:hidden;-webkit-text-size-adjust:100%;font-size:var(--fs)}
header{background:var(--ac);color:#fff;padding:8px 12px;font-size:calc(var(--fs) + 2px);display:flex;align-items:center;justify-content:space-between;gap:8px;flex-wrap:wrap}
.hdr-left{display:flex;align-items:center;gap:8px}
.hdr-user{font-size:calc(var(--fs) - 1px);opacity:.9;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:120px}
nav{display:flex;background:var(--card);border-bottom:1px solid var(--bd);position:sticky;top:0;z-index:10;overflow-x:auto;-webkit-overflow-scrolling:touch}
nav button{flex:1 0 auto;padding:10px 6px;border:0;background:none;font-size:calc(var(--fs) - 3px);color:var(--tx);white-space:nowrap;min-width:0}
nav button.on{box-shadow:inset 0 -3px 0 var(--ac);font-weight:600}
main{padding:8px 8px calc(80px + var(--sab) + var(--kb,0px));max-width:900px;margin:0 auto;width:100%}
.card{background:var(--card);border:1px solid var(--bd);border-radius:10px;padding:10px;margin-bottom:8px;overflow:hidden;word-wrap:break-word}
.card.clickable{cursor:pointer}.card.clickable:active{opacity:.85}
table{width:100%;border-collapse:collapse;font-size:calc(var(--fs) - 1px);table-layout:fixed}
td,th{padding:5px 4px;border-bottom:1px solid var(--bd);text-align:left;vertical-align:middle;word-wrap:break-word;overflow-wrap:break-word;overflow:hidden;text-overflow:ellipsis}
.badge{border-radius:8px;padding:2px 6px;font-size:calc(var(--fs) - 3px);white-space:nowrap;display:inline-block}
.bExp{background:#ffd2d2;color:#7a1010}.bSoon{background:#ffe0c2;color:#8a4b00}
.bWarn{background:#fff3c2;color:#7a6000}.bOk{background:#d9f2d9;color:#1b5e20}
.bG{background:#2e7d32;color:#fff}.bY{background:#f9a825;color:#332}.bR{background:#c62828;color:#fff}
tr.exp{background:#ffe3e3}tr.soon{background:#ffedd9}
tr.highlight{animation:hlPulse 1.5s ease-in-out 3}
@keyframes hlPulse{0%,100%{background:transparent}50%{background:#fff3c2}}
.btn{background:var(--ac);color:#fff;border:0;border-radius:8px;padding:8px 12px;font-size:var(--fs);margin:3px 3px 3px 0;white-space:nowrap;max-width:100%}
.btn.sec{background:transparent;color:var(--ac);border:1px solid var(--ac)}
.btn.del{background:transparent;color:#c62828;border:1px solid #c62828;padding:4px 8px;margin:0}
.btn.mini{padding:4px 8px;margin:0;font-size:calc(var(--fs) - 2px)}
.btn.wide{width:100%;padding:12px;margin:4px 0}
input,select,textarea{padding:8px;border:1px solid var(--bd);border-radius:8px;font-size:var(--fs);width:100%;box-sizing:border-box;background:var(--card);color:var(--tx);min-width:0}
textarea{min-height:60px;resize:vertical}
input[type=date]{width:130px!important;flex:none!important}
label{font-size:calc(var(--fs) - 2px);color:var(--mut);display:block;margin-top:4px}
.row{display:flex;gap:6px;flex-wrap:wrap}.row>*{flex:1 1 45%;min-width:0}
.prev{max-height:200px;overflow:auto;border:1px solid var(--bd);border-radius:8px;margin:6px 0;padding:4px;-webkit-overflow-scrolling:touch}
.loginwrap{max-width:400px;margin:20px auto;padding:0 8px}
.bigbtn{display:block;width:100%;margin:4px 0;padding:12px;border-radius:12px;border:1px solid var(--bd);background:var(--card);color:var(--tx);font-size:calc(var(--fs) + 1px);text-align:left;word-wrap:break-word}
.chatbox{height:260px;overflow:auto;background:var(--card);border:1px solid var(--bd);border-radius:10px;padding:6px;margin:6px 0;-webkit-overflow-scrolling:touch}
.msg{margin:3px 0;padding:5px 7px;border-radius:8px;background:var(--bg);font-size:calc(var(--fs) - 1px);word-wrap:break-word;overflow-wrap:break-word}
.msg b{color:var(--ac)}.msg small{color:var(--mut)}.chatIn{display:flex;align-items:flex-end;gap:6px;margin:8px 0;flex-wrap:nowrap}.chatIn textarea{flex:1 1 auto;min-width:0;resize:none;min-height:38px;max-height:100px;padding:8px;line-height:1.3;font-family:inherit;font-size:16px;box-sizing:border-box}.chatIn .btn{flex:0 0 auto;margin:0;padding:8px 16px}
.wgrid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.wgrid .card{margin-bottom:0}
.wgrid .span2{grid-column:span 2}
.clockWeather{display:flex;align-items:center;justify-content:space-between;gap:10px;cursor:pointer;padding:10px;background:var(--card);border:1px solid var(--bd);border-radius:10px;margin-bottom:8px}
.clockWeather:active{opacity:.85}
.cwLeft{display:flex;flex-direction:column;line-height:1.3}
.cwTime{font-size:calc(var(--fs) + 6px);font-weight:700;color:var(--tx)}
.cwDate{font-size:calc(var(--fs) - 2px);color:var(--mut)}
.cwRight{text-align:right;white-space:nowrap}
.cwTemp{font-size:calc(var(--fs) + 4px);font-weight:600}
.cwDesc{font-size:calc(var(--fs) - 3px);color:var(--mut)}.cwSeason{text-align:center;flex:0 0 auto;line-height:1.3;padding:0 4px;font-size:calc(var(--fs) + 3px);white-space:nowrap;max-width:45%;overflow:hidden;text-overflow:ellipsis}
.forecastGrid{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;margin-top:8px}
.fcDay{text-align:center;padding:6px 2px;background:var(--bg);border-radius:6px;font-size:calc(var(--fs) - 3px)}
.fcDay.today{background:var(--ac);color:#fff}
.fcDay .fcTemp{font-weight:700;font-size:calc(var(--fs) - 1px);margin-top:2px}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:1px;font-size:calc(var(--fs) - 4px)}
.cal div{padding:2px 0;text-align:center;border-radius:4px}
.cal .td{background:var(--ac);color:#fff;font-weight:700}
.cal .hd{color:var(--mut);font-weight:600}
.thumbs{display:flex;flex-wrap:wrap;gap:6px}
.thumbs img{width:100px;height:100px;object-fit:cover;border-radius:8px;border:1px solid var(--bd);cursor:pointer}
.toast{position:fixed;left:50%;bottom:18px;transform:translateX(-50%);background:#222;color:#fff;padding:8px 16px;border-radius:10px;font-size:calc(var(--fs) - 1px);opacity:0;pointer-events:none;transition:opacity .3s;z-index:99;max-width:92%;text-align:center;word-wrap:break-word}
.toast.show{opacity:1}
#dlg{margin:4px auto;max-height:calc(100vh - 8px);overflow:auto;width:calc(100% - 8px);border-radius:12px;border:1px solid var(--bd)}
#dlg::backdrop{background:rgba(0,0,0,.25)}
.photoDlgBody{display:flex;flex-direction:column;height:min(85vh,calc(100vh - 32px))}
.photoViewport{flex:1;min-height:0;overflow:hidden;position:relative;background:#000;border-radius:8px;touch-action:none;cursor:grab}
.photoViewport.grabbing{cursor:grabbing}
.photoViewport img{position:absolute;top:50%;left:50%;transform-origin:center center;user-select:none;-webkit-user-drag:none;pointer-events:none}
.photoZoomBar{flex-shrink:0;display:flex;align-items:center;gap:4px;margin-top:6px;justify-content:center;flex-wrap:wrap}
.photoZoomBar .btn{margin:0;padding:6px 10px;font-size:calc(var(--fs) + 1px);min-width:36px}
.photoZoomBar span{font-size:calc(var(--fs) - 3px);color:var(--mut);min-width:40px;text-align:center}
.photoBtns{flex-shrink:0;display:flex;gap:6px;margin-top:6px}
.photoBtns .btn{flex:1;margin:0}
.reportDetail p{margin:3px 0;font-size:calc(var(--fs) - 1px);word-wrap:break-word}
.reportDetail b{color:var(--ac)}
.reportDetail .rdSection{margin-top:8px;padding-top:6px;border-top:1px solid var(--bd)}
.reportDetail .rdDefect{color:#c62828;font-size:calc(var(--fs) - 2px);word-wrap:break-word}
.col-name{width:40%}.col-spec{width:20%}.col-qty{width:12%}.col-exp{width:18%}.col-act{width:10%}
.col-ovm{width:15%}.col-eqname{width:30%}.col-status{width:18%}.col-notes{width:18%}.col-mark{width:19%}
.editMode input,.editMode select{border-color:var(--ac);background:#fffde7}
body.dark .editMode input,body.dark .editMode select{background:#2a2a1a}
.tplHeader{display:flex;align-items:center;justify-content:space-between;padding:10px;cursor:pointer;border-radius:8px;margin-bottom:4px;background:var(--bg);transition:background .15s}
.tplHeader:hover{opacity:.85}
.tplHeader b{font-size:calc(var(--fs) + 1px)}
.tplHeader .tplCount{font-size:calc(var(--fs) - 2px);color:var(--mut)}
.tplBody{display:none;padding:4px 0}
.tplBody.open{display:block}
.searchBox{margin:6px 0;position:relative}
.searchBox input{padding-right:30px}
.searchClear{position:absolute;right:8px;top:50%;transform:translateY(-50%);background:none;border:0;color:var(--mut);font-size:16px;cursor:pointer;padding:0}
.drugResults{max-height:150px;overflow:auto;border:1px solid var(--bd);border-radius:8px;margin-top:4px;background:var(--card)}
.drugItem{padding:6px 8px;cursor:pointer;border-bottom:1px solid var(--bd);font-size:calc(var(--fs) - 1px)}
.drugItem:hover,.drugItem:active{background:var(--bg)}
.drugItem:last-child{border-bottom:0}
.drugItem .diName{font-weight:600;color:var(--ac)}
.drugItem .diSpec{color:var(--mut);font-size:calc(var(--fs) - 2px)}
.refSearch{position:sticky;top:0;z-index:5;background:var(--bg);padding:8px 0}
.refCard{background:var(--card);border:1px solid var(--bd);border-radius:10px;padding:12px;margin-bottom:8px}
.refCard h4{margin:0 0 6px;color:var(--ac)}
.refRow{display:flex;gap:8px;margin-bottom:4px;font-size:calc(var(--fs) - 1px)}
.refLabel{color:var(--mut);min-width:80px;flex-shrink:0}
.refVal{font-weight:500}
.refRx{background:var(--bg);border-radius:8px;padding:8px 10px;margin-top:8px;font-family:'Courier New',monospace;font-size:calc(var(--fs) - 1px);white-space:pre-wrap;word-break:break-word;border-left:3px solid var(--ac)}
.refAnalogs{margin-top:6px;font-size:calc(var(--fs) - 2px);color:var(--mut)}
.refAnalogs span{display:inline-block;background:var(--bg);border-radius:4px;padding:2px 6px;margin:2px 2px 0 0}
@media(max-width:480px){
header{padding:6px 10px}
.hdr-user{max-width:90px}
nav button{padding:8px 4px}
main{padding:6px 6px calc(80px + var(--sab) + var(--kb,0px))}
.card{padding:8px;border-radius:8px}
.btn{padding:7px 10px;margin:2px}
.btn.mini{padding:3px 6px}
.bigbtn{padding:10px}
.wgrid{grid-template-columns:1fr}
.wgrid .span2{grid-column:span 1}
.clockWeather{padding:8px;gap:6px}
.forecastGrid{grid-template-columns:repeat(4,1fr)}
.thumbs img{width:80px;height:80px}
.chatbox{height:220px}
.msg{padding:4px 6px}
.row>*{flex:1 1 100%}
#dlg{width:calc(100% - 4px);margin:2px auto}
.loginwrap{margin:10px auto}
.col-name{width:35%}.col-spec{width:18%}.col-qty{width:12%}.col-exp{width:22%}.col-act{width:13%}
.col-ovm{width:12%}.col-eqname{width:28%}.col-status{width:20%}.col-notes{width:20%}.col-mark{width:20%}
input[type=date]{width:110px!important}
.refLabel{min-width:60px}
}
@media(min-width:481px) and (max-width:768px){
main{padding:10px 10px calc(80px + var(--sab) + var(--kb,0px))}
.wgrid{grid-template-columns:1fr 1fr}
}
@media(min-width:769px){
main{padding:12px 12px calc(80px + var(--sab) + var(--kb,0px))}
td,th{padding:6px 4px}
.btn{padding:9px 14px}
.thumbs img{width:110px;height:110px}
.chatbox{height:280px}
#dlg{width:min(680px,95%);margin:8px auto}
}
</style>
</head>

<header><div class="hdr-left">МедСмена <span id="alarm"></span> <span id="headcount" style="font-size:calc(var(--fs) - 2px);opacity:.9"></span></div><span class="hdr-user" id="hdrUser"></span></header>

/* === ДИНАМИЧЕСКИЙ VH + КЛАВИАТУРА + УМНЫЙ СКРОЛЛ К ПОЛЯМ === */
function setVH(){document.documentElement.style.setProperty('--vh',window.innerHeight*0.01+'px')}
function setKb(){var kb=0;if(window.visualViewport){kb=Math.max(0,window.innerHeight-window.visualViewport.height)}document.documentElement.style.setProperty('--kb',kb+'px')}
setVH();setKb();
window.addEventListener('resize',function(){setVH();setKb()});
window.addEventListener('orientationchange',function(){setTimeout(setVH,100);setTimeout(setKb,150)});
if(window.visualViewport){window.visualViewport.addEventListener('resize',function(){setVH();setKb()});window.visualViewport.addEventListener('scroll',function(){setVH();setKb()})}
document.addEventListener('focusin',function(e){
var t=e.target;
if(t.tagName==='INPUT'||t.tagName==='TEXTAREA'||t.tagName==='SELECT'){
setTimeout(function(){
setKb();
var kb=0;if(window.visualViewport){kb=Math.max(0,window.innerHeight-window.visualViewport.height)}
var vh=window.visualViewport?window.visualViewport.height:window.innerHeight;
var rect=t.getBoundingClientRect();
var bottom=rect.bottom+kb;
if(bottom>=vh){window.scrollBy({top:bottom-vh+20,behavior:'smooth'})}
var box=document.getElementById('cbox');if(box){box.scrollTop=box.scrollHeight}
},300);
}
});

n></td></tr>'}});h+='</tbody></table>';if(highlightItem){setTimeout(function(){highlightItem=null},4500)}return h}

function pickDrug(prefix,idx){
    var d=window['__drugs_'+prefix];
    if(!d||!d[idx])return;
    var item=d[idx];
    if(prefix==='pot_item')return pickPotDrug(idx);
    var resEl=document.getElementById(prefix+'_results');
    if(resEl)resEl.innerHTML='';
    var searchEl=document.getElementById(prefix+'_search');
    if(searchEl)searchEl.value='';
    if(prefix.indexOf('tpl_')===0){
        var tid=prefix.substring(4);
        if(tid==='bag'){DB.bagTypes[0].items.push({name:item.n,spec:item.s,unit:item.u,qty:1,potent:false})}else{var ki=parseInt(tid.replace('kit_','')||'0');if(!isNaN(ki))DB.kitTemplates[ki].items.push({name:item.n,spec:item.s,unit:item.u,qty:1,potent:tid.indexOf('kit_4')===0})}
        save();render();toast('✅ Добавлено в шаблон: '+item.n);
        return;
    }
    var nameEl=document.getElementById(prefix+'_name');
    var specEl=document.getElementById(prefix+'_spec');
    var unitEl=document.getElementById(prefix+'_unit');
    if(nameEl)nameEl.value=item.n;
    if(specEl)specEl.value=item.s;
    if(unitEl)unitEl.value=item.u;
    toast('✅ Подставлено: '+item.n);
}

function compressImage(f,cb){var r=new FileReader();r.onload=function(){var im=new Image();im.onload=function(){var max=1200;var w=im.width,h=im.height;if(w>max||h>max){var k=Math.min(max/w,max/h);w=Math.round(w*k);h=Math.round(h*k)}var cv=document.createElement('canvas');cv.width=w;cv.height=h;cv.getContext('2d').drawImage(im,0,0,w,h);cb(cv.toDataURL('image/jpeg',0.7))};im.src=r.result};r.readAsDataURL(f)}

function initPhotoViewer(){var port=document.getElementById('pvPort');var img=document.getElementById('pvImg');var label=document.getElementById('pvLabel');if(!port||!img)return;var scale=1,panX=0,panY=0,minScale=0.5,maxScale=8;var dragging=false,startX=0,startY=0,startPanX=0,startPanY=0;var lastPinchDist=0,lastPinchScale=1;function applyTransform(){img.style.transform='translate(calc(-50% + '+panX+'px), calc(-50% + '+panY+'px)) scale('+scale+')';label.textContent=Math.round(scale*100)+'%'}function clampPan(){var pw=port.clientWidth,ph=port.clientHeight;var iw=img.naturalWidth||pw,ih=img.naturalHeight||ph;var sw=iw*scale,sh=ih*scale;var maxX=Math.max(0,(sw-pw)/2);var maxY=Math.max(0,(sh-ph)/2);panX=Math.max(-maxX,Math.min(maxX,panX));panY=Math.max(-maxY,Math.min(maxY,panY))}img.onload=function(){var pw=port.clientWidth,ph=port.clientHeight;var iw=img.naturalWidth,ih=img.naturalHeight;scale=Math.min(pw/iw,ph/ih,1);panX=0;panY=0;applyTransform()};if(img.complete&&img.naturalWidth){img.onload()}port.addEventListener('wheel',function(e){e.preventDefault();var delta=e.deltaY>0?0.9:1.1;var ns=Math.max(minScale,Math.min(maxScale,scale*delta));var rect=port.getBoundingClientRect();var mx=e.clientX-rect.left-rect.width/2;var my=e.clientY-rect.top-rect.height/2;panX=mx-(mx-panX)*(ns/scale);panY=my-(my-panY)*(ns/scale);scale=ns;clampPan();applyTransform()},{passive:false});port.addEventListener('mousedown',function(e){e.preventDefault();dragging=true;startX=e.clientX;startY=e.clientY;startPanX=panX;startPanY=panY;port.classList.add('grabbing')});window.addEventListener('mousemove',function(e){if(!dragging)return;panX=startPanX+(e.clientX-startX);panY=startPanY+(e.clientY-startY);clampPan();applyTransform()});window.addEventListener('mouseup',function(){dragging=false;port.classList.remove('grabbing')});port.addEventListener('touchstart',function(e){if(e.touches.length===1){dragging=true;startX=e.touches[0].clientX;startY=e.touches[0].clientY;startPanX=panX;startPanY=panY}else if(e.touches.length===2){dragging=false;var dx=e.touches[0].clientX-e.touches[1].clientX;var dy=e.touches[0].clientY-e.touches[1].clientY;lastPinchDist=Math.sqrt(dx*dx+dy*dy);lastPinchScale=scale}},{passive:false});port.addEventListener('touchmove',function(e){e.preventDefault();if(e.touches.length===1&&dragging){panX=startPanX+(e.touches[0].clientX-startX);panY=startPanY+(e.touches[0].clientY-startY);clampPan();applyTransform()}else if(e.touches.length===2){var dx=e.touches[0].clientX-e.touches[1].clientX;var dy=e.touches[0].clientY-e.touches[1].clientY;var dist=Math.sqrt(dx*dx+dy*dy);if(lastPinchDist>0){var ns=Math.max(minScale,Math.min(maxScale,lastPinchScale*(dist/lastPinchDist)));var cx=(e.touches[0].clientX+e.touches[1].clientX)/2;var cy=(e.touches[0].clientY+e.touches[1].clientY)/2;var rect=port.getBoundingClientRect();var mx=cx-rect.left-rect.width/2;var my=cy-rect.top-rect.height/2;panX=mx-(mx-panX)*(ns/scale);panY=my-(my-panY)*(ns/scale);scale=ns;clampPan();applyTransform()}}},{passive:false});port.addEventListener('touchend',function(e){if(e.touches.length<2){lastPinchDist=0;lastPinchScale=scale}if(e.touches.length===0)dragging=false});window.pvZoom=function(dir){var ns=Math.max(minScale,Math.min(maxScale,scale*(dir>0?1.3:0.77)));panX=panX*(ns/scale);panY=panY*(ns/scale);scale=ns;clampPan();applyTransform()};window.pvReset=function(){scale=1;panX=0;panY=0;applyTransform()};window.__photoCleanup=function(){window.pvZoom=null;window.pvReset=null}}

async function enableBiometric(){try{var u=me();if(!u||!u.pin){toast('Нет PIN');return}var challenge=new Uint8Array(32);crypto.getRandomValues(challenge);var cred=await navigator.credentials.create({publicKey:{challenge:challenge,rp:{name:'МедСмена'},user:{id:new TextEncoder().encode(String(u.id)),name:u.name,displayName:u.name},pubKeyCredParams:[{alg:-7,type:'public-key'},{alg:-257,type:'public-key'}],authenticatorSelection:{authenticatorAttachment:'platform',userVerification:'required'},timeout:60000,attestation:'none'}});if(!cred){toast('Отменено');render();return}var id=btoa(String.fromCharCode.apply(null,Array.from(new Uint8Array(cred.rawId))));localStorage.setItem('medshift_bio',JSON.stringify({userId:u.id,credentialId:id}));toast('🔓 Биометрия включена');render()}catch(e){toast('Не вышло: '+(e.message||'устройство не поддерживает'));render()}}
